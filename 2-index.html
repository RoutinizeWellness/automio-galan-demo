<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Compres en pilot automàtic · Demo Galán v1</title>
<style>:root{--bg:#f4f5f8;--card:#fff;--ink:#1c2b43;--mute:#667085;--line:#e3e7ee;--red:#e2241d;--navy:#172c65;--blubg:#e9edf9;--redbg:#fdebea;--amb:#9a5b00;--ambbg:#fff3df;--grn:#17663a;--grnbg:#e4f5ea}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.45 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px}
.brand{padding:2px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}.brand img{height:30px;display:block}.brand small{display:block;margin-top:10px;font-size:10px;letter-spacing:.12em;color:#7d8797;font-weight:600}
aside a{display:flex;align-items:center;gap:8px;color:#2c3a54;text-decoration:none;padding:10px 12px;border-radius:8px;cursor:pointer;border-left:3px solid transparent;font-weight:500}
aside a:hover{background:#f4f6fa}aside a.on{background:var(--blubg);color:var(--navy);font-weight:700;border-left-color:var(--red)}
.n{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px;font-weight:600}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--mute);border-top:1px solid var(--line);padding:12px 8px}
.side-foot i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1f9d55;margin-right:5px}
main{padding:0 26px 40px;min-width:0}
.topbar{height:60px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);margin:0 -26px 18px;padding:0 26px}
.topbar img{height:26px}.topbar .sp{flex:1}.pill{font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--ambbg);color:var(--amb);border:1px solid #f1d19a;border-radius:99px;padding:3px 10px}
h1{font-size:21px;margin:0;color:var(--navy)}h2{font-size:15px;margin:0 0 10px;color:var(--navy)}.sub{color:var(--mute);margin:2px 0 16px}
.banner{background:var(--ambbg);color:#6b4100;border:1px solid #f1d19a;border-radius:8px;padding:7px 12px;font-size:12px;margin-bottom:16px}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.5fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.kpi{cursor:pointer;border-top:3px solid var(--line)}.kpi:hover{border-color:var(--navy)}.kpi b{font-size:28px;display:block;line-height:1.1}.kpi span{color:var(--mute);font-size:12.5px}
.kpi.bad{border-top-color:var(--red)}.kpi.bad b{color:var(--red)}.kpi.warn{border-top-color:#e8890c}.kpi.warn b{color:var(--amb)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}input[type=search]{min-width:230px;flex:1}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
button.btn{font:inherit;font-size:13px;border:1px solid var(--red);background:var(--red);color:#fff;border-radius:8px;padding:7px 13px;cursor:pointer}button.btn.ghost{background:#fff;color:var(--navy);border-color:#c9d0e0}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f8f9fb}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}tr.row{cursor:pointer}tr.row:hover td{background:#f8f9fc}.tw{overflow-x:auto}
.tag{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.t-red{background:var(--redbg);color:#b42318}.t-amb{background:var(--ambbg);color:var(--amb)}.t-grn{background:var(--grnbg);color:var(--grn)}.t-blu{background:var(--blubg);color:var(--navy)}.t-gry{background:#eef0f3;color:#475467}
.mut{color:var(--mute)}.small{font-size:12.5px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}.item:last-child{border:0}.item:hover{background:#fafbfd}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}.d-red{background:var(--red)}.d-amb{background:#e8890c}.d-blu{background:var(--navy)}.d-gry{background:#a7b0bf}.d-grn{background:#1f9d55}
.item .b{flex:1;min-width:0}.src{font-size:11px;background:#eef0f3;border-radius:4px;padding:0 5px;margin-left:4px;color:#444}
.diff{background:#fff8e6;border:1px solid #f1d19a;border-radius:8px;padding:6px 10px;margin-top:6px;font-size:12.5px}.diff s{color:#a33}.diff b{color:var(--grn)}
.sugg{background:var(--blubg);border-radius:8px;padding:9px 12px;margin:10px 0;font-size:13px}
.drawer{position:fixed;inset:0;background:rgba(10,20,40,.45);display:none;z-index:20}.drawer.on{display:block}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(580px,100%);background:#fff;padding:20px;overflow:auto}
.x{float:right;border:0;background:#eef0f3;border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer}
.tl{margin:8px 0 0;padding:0;list-style:none;border-left:2px solid var(--line)}.tl li{padding:0 0 10px 14px;position:relative;font-size:13px}.tl li:before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--navy)}
textarea{width:100%;min-height:150px}.act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;margin:12px 0}.kv div:nth-child(odd){color:var(--mute)}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:none;font:inherit;padding:9px 14px;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent}.tabs button.on{color:var(--navy);font-weight:700;border-bottom-color:var(--red)}
.bar{height:7px;background:#eceef2;border-radius:99px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--navy)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172c65;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:40;display:none}
.src-list a{color:var(--navy)}.src-list li{margin:4px 0}
nav.mob{display:none}.mtop{display:none}
@media(max-width:900px){.app{display:block}aside{display:none}main{padding:0 12px 90px}.topbar{margin:0 -12px 14px;padding:0 12px;height:52px}.topbar .pill{display:none}
.k4{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.hide-m{display:none}input[type=search]{min-width:0;width:100%}.kv{grid-template-columns:100px 1fr}
nav.mob{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav.mob a{color:#444;text-decoration:none;font-size:11px;text-align:center;padding:6px 2px;flex:1;border-top:3px solid transparent}nav.mob a.on{color:var(--navy);font-weight:700;border-top-color:var(--red)}
td,th{padding:8px 5px}}

.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}.heading .sub{margin-bottom:12px}.hero{background:#152b50;color:white;border-radius:14px;padding:26px;display:grid;grid-template-columns:1fr 1.12fr;gap:28px;margin:4px 0 14px}.hero h2{font-size:25px;line-height:1.23;color:white;margin:10px 0 12px;letter-spacing:-.02em}.hero p{color:#c8d5e8;font-size:14px;line-height:1.6;max-width:480px}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:700;color:#aebfd9}.hero .btn{background:#ed3931;border-color:#ed3931;font-weight:600;padding:10px 15px}.hero .btn.light{background:transparent;color:white;border-color:#60769a}.cycle{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:center}.stage{padding:14px 12px;border:1px solid #52627e;border-radius:10px;background:#20395c;min-height:98px;opacity:.68}.stage span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#425879;font-size:12px;font-weight:700;margin-bottom:8px}.stage b{display:block;font-size:12px}.stage small{font-size:10px;color:#c3d2e9}.stage.complete{background:#204c46;border-color:#4d9e81;opacity:1}.stage.complete span{background:#81d3ab;color:#10382c}.stage.current{border-color:#f6af6f;opacity:1}.stage.current span{background:#f4b16e;color:#3d290c}.metrics{margin:18px 0}.kpi{font:inherit;text-align:left;color:var(--ink)}.kpi.good{border-top:3px solid #25855a}.kpi.good b{color:#17663a}.mailitem{width:100%;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;text-align:left;color:var(--ink)}.mailitem .b>span{display:block;margin-top:3px}.mailitem .b>b{font-size:13px}.mailitem>.tag{align-self:flex-start}.mailitem>span:last-child{flex:none}.checklist{padding-left:18px;margin:14px 0}.checklist li{margin:12px 0;padding-left:3px}.empty{padding:25px 4px;color:var(--mute)}.mailbody{white-space:pre-wrap;background:#f7f8fa;padding:14px;border:1px solid var(--line);border-radius:8px;font:13px/1.6 inherit;overflow-wrap:anywhere}.panel h3{color:var(--navy);font-size:13px;margin:22px 0 8px}.mini2{grid-template-columns:1fr 1fr}.mini2 .sugg{margin:0;font-size:12px}.policy{padding:14px;background:#e9edf9;border-radius:8px;font-size:13px}.tabs{overflow:auto}.tabs button{white-space:nowrap}.card details,details{margin:18px 0 8px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--navy)}button:disabled{opacity:.45;cursor:default}.topbar .version{font-size:11px;color:#667085}.banner{font-size:11.5px}.panel{width:min(680px,100%)}a,button,input,select,textarea{outline-offset:3px}button:focus-visible,a:focus-visible{outline:2px solid #2859ad}.item{transition:background .12s}.topbar img{max-width:160px}
@media(min-width:1450px){main{padding-left:38px;padding-right:38px}.topbar{margin-left:-38px;margin-right:-38px;padding-left:38px;padding-right:38px}}
@media(max-width:1150px){.hero{grid-template-columns:1fr 1fr;padding:20px;gap:18px}.hero h2{font-size:22px}.stage{padding:10px 8px}.mailitem{flex-wrap:wrap}.mailitem>span:last-child{margin-left:22px}.mailitem .b{min-width:65%}}
@media(max-width:650px){h1{font-size:21px}.hero{grid-template-columns:1fr;padding:20px;gap:12px}.hero h2{font-size:25px}.hero p{font-size:13px}.cycle{gap:7px}.stage{min-height:86px}.stage b{font-size:11px}.hero .act{flex-direction:column}.hero .btn{width:100%}.mini2{grid-template-columns:1fr}.heading{gap:4px}.heading>.btn{margin-bottom:12px}.kpi b{font-size:26px}.card{padding:13px}.mailitem{gap:8px;padding:14px 0}.mailitem .b{min-width:72%}.mailitem>span:last-child{margin-left:18px}.panel{padding:17px 16px 90px}.panel h2{max-width:90%;font-size:18px}.sub{font-size:13px}.topbar .version{font-size:10px}.tools .small{font-size:11px}.banner{line-height:1.5}.kpi span{font-size:11px}.tabs button{padding:9px 10px}nav.mob a{font-size:10px;min-height:42px}.mailbody{font-size:12px}}

</style><style>/* v18: Comandes en targetes a l'iPhone, amb totes les columnes */
@media(max-width:700px){table.cmdt,table.cmdt tbody,table.cmdt tr,table.cmdt td{display:block;width:100%}table.cmdt thead{display:none}table.cmdt tr{padding:12px 4px;border-bottom:1px solid var(--line)}table.cmdt td,table.cmdt td.hide-m{padding:3px 4px;border:0;display:flex;justify-content:space-between;gap:12px;align-items:center}table.cmdt td:first-child{display:block;font-weight:700}table.cmdt td:nth-child(2){display:block;color:var(--mute)}table.cmdt td:nth-child(3)::before{content:"Comprador";color:var(--mute);font-size:11px;text-transform:uppercase}table.cmdt td:nth-child(4)::before{content:"Prometuda";color:var(--mute);font-size:11px;text-transform:uppercase}table.cmdt td:nth-child(5)::before{content:"Confirmada";color:var(--mute);font-size:11px;text-transform:uppercase}table.cmdt td:nth-child(6)::before{content:"Estat";color:var(--mute);font-size:11px;text-transform:uppercase}table.cmdt td:nth-child(7)::before{content:"Rebut";color:var(--mute);font-size:11px;text-transform:uppercase}table.cmdt td:nth-child(7) .bar{width:55%}table.cmdt td[colspan]{display:block}}
/* v16: pestanyes de Més visibles a l'iPhone sense lliscar */
@media(max-width:700px){.tabs{flex-wrap:wrap;overflow:visible}.tabs button{padding:9px 10px}}
/* v15: tabla de proveïdors en iPhone, una tarjeta por fila, con todas las columnas */
@media(max-width:700px){table.provt,table.provt tbody,table.provt tr,table.provt td{display:block;width:100%}table.provt thead{display:none}table.provt tr{padding:12px 4px;border-bottom:1px solid var(--line)}table.provt td{padding:3px 4px;border:0;display:flex;justify-content:space-between;gap:12px;align-items:center}table.provt td.hide-m{display:flex}table.provt td:first-child{display:block}table.provt td:nth-child(2)::before{content:"Àrea";color:var(--mute);font-size:11px;text-transform:uppercase}table.provt td:nth-child(3)::before{content:"Termini hab.";color:var(--mute);font-size:11px;text-transform:uppercase}table.provt td:nth-child(4)::before{content:"Puntualitat (fictícia)";color:var(--mute);font-size:11px;text-transform:uppercase;white-space:nowrap}table.provt td:nth-child(4){display:block}table.provt td:nth-child(4)::before{display:block;margin-bottom:4px}table.provt td:nth-child(5)::before{content:"Obertes";color:var(--mute);font-size:11px;text-transform:uppercase}}
/* v12: menos repetición, decisiones primero. */
@media(min-width:901px){.topbar #tl{display:none}}
.apkpis{grid-template-columns:repeat(2,minmax(0,1fr))}.apgrid>.apcard:first-child{order:2}.apgrid>.apcard:last-child{order:1}.apdemof{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px}.apcontrols{flex-wrap:nowrap}.apcontrols .mxbtn{white-space:nowrap;min-height:44px}.apcontrols .mxmeta{margin-left:auto;white-space:nowrap}.aphero h1{max-width:700px}.apdemof .mxbtn{min-height:44px}
@media(max-width:900px){.topbar .pill{display:inline-block;font-size:9px;padding:3px 7px;white-space:nowrap}.topbar .version{display:none}.topbar #tl{height:25px;width:128px}.apcontrols{gap:7px}.apcontrols .mxbtn{padding:8px 10px;font-size:12px}.apcontrols .mxmeta{font-size:10px}.aphero{padding:19px}.aphero h1{font-size:26px}.aphero p{font-size:13px}.apdemof{align-items:flex-start;font-size:11px}}
</style></head><body>

const oldOvV=ov;ov=function(){oldOvV();cycleOrder.cd=V.stage>=5?'2026-11-16':null};

function autoV(){return `<div class="grid two"><div class="card"><h2>Decideix fins on pot arribar</h2><p class="mut small">Aquestes regles afecten la simulació de triaje i el cicle. No són permisos concedits per Galán.</p><label>Nivell d’autonomia<select id="lvl" style="display:block;width:100%;margin:8px 0 16px" onchange="V.level=this.value;V.scanned=false;persist();render()">${[['observe','1 · Observar i proposar'],['approval','2 · Preparar i demanar aprovació'],['auto','3 · Executar dins de regles']].map(([k,t])=>`<option value="${k}" ${V.level===k?'selected':''}>${t}</option>`).join('')}</select></label><div class="policy">${{observe:'No simula enviaments ni actualitzacions. Només classifica i proposa.',approval:'Classifica i prepara. El pas d’enviament del cicle demana una aprovació.',auto:'Gestiona casos segurs sense clic. Excepcions comercials, ambigüitats i impacte en client sempre s’escalen.'}[V.level]}</div><label style="display:block;margin-top:18px">Màxim canvi de data sense client afectat<select id="lim" onchange="V.delayLimit=Number(this.value);V.scanned=false;persist();render()">${[0,1,2].map(n=>`<option value="${n}" ${V.delayLimit===n?'selected':''}>${n} ${n===1?'dia':'dies'}</option>`).join('')}</select></label><p class="small mut">En els 12 correus de mostra, canvis de preu, substitucions i quantitats demanades requereixen aprovació humana. A Avui, el cicle independent de 5 casos prova una tolerància de preu explícita, només simulada.</p><button class="btn ${V.paused?'':'ghost'}" onclick="V.paused=!V.paused;logV('Motor',V.paused?'Pausa manual':'Reprès');render()">${V.paused?'Reprendre el motor':'Pausar el motor'}</button></div><div class="card"><h2>Guardes que no es poden saltar</h2><ul class="checklist"><li>Canvi de preu → revisió comercial</li><li>Client afectat → decisió de compres/vendes</li><li>Referència incerta → demanar dades</li><li>Substitució de material → validació tècnica</li><li>2 terminis sense resposta → escalar, no insistir sense límit</li><li>Recepció física → evidència del magatzem</li><li>Factura diferent → bloquejar conformitat</li><li>Sense ACK del connector → no donar per actualitzat</li></ul><h3>Prova un error de connector</h3><label><input type="checkbox" ${V.fail?'checked':''} onchange="V.fail=this.checked;persist()"> Simular fallada d’actualització ERP</label><p class="small mut">Activa-la abans del pas 5. El cicle no es tanca sense justificant. Desactiva-la i avança per reprendre, sense reenviar la reclamació.</p><details><summary>Preparació per a un pilot real</summary><p>Cal validar ERP/API i permisos d’escriptura, identitats de correu, signatures, límits, franges horàries, retenció i responsables. Primer lectura i comparació amb decisions humanes; després autonomia restringida i mesurada.</p></details></div></div>`}
function auditV(){return `<div class="card"><h2>Tot el que ha passat, amb motiu</h2><p class="small mut">Traça local de demostració. Un producte real necessitaria registre persistent, controls d’accés i evidències no editables.</p>${V.audit.length?`<div class="tw"><table><thead><tr><th>#</th><th>Hora local</th><th>Acció</th><th>Motiu / resultat</th></tr></thead><tbody>${V.audit.map(a=>`<tr><td>${a.n}</td><td>${a.time}</td><td>${a.type}</td><td>${esc(a.detail)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Simula un cicle o el triaje per generar evidències.</div>'}</div>`}
function scopeV(){return `<div class="grid two"><div class="card"><h2>Què és real i què és simulat</h2><ul><li><b>Real:</b> interfície, navegació, filtres i persistència al navegador.</li><li><b>Simulat:</b> classificació, extracció, enviament, resposta, actualització i ACK de l’ERP.</li><li><b>Desconnectat:</b> correu, ERP, documents, IA i qualsevol pagament.</li><li>Tots els proveïdors, persones operatives, comandes i xifres són ficticis.</li><li>Cap resultat és una promesa d’estalvi, precisió o viabilitat tècnica.</li></ul><p>La connexió i l’autonomia real depenen d’una anàlisi del sistema, de les regles aprovades i d’un pilot.</p></div><div class="card"><h2>Context públic</h2><p>Galán Textile Machinery és una fabricant de maquinària tèxtil (filatura, retors i bobinatge) fundada el 1940 a Terrassa, de tercera generació familiar, que produeix per ordres de fabricació i exporta a tot el món.</p><a href="https://galan.es/sobre-galan/" target="_blank" rel="noopener">Font: web oficial de Galán</a><p class="small mut">Demo independent, no és un producte oficial de Galán. Logotip públic usat només per a aquesta presentació.</p></div></div>`}
resetDemo=function(){V=seed();persist();A={};save();ov();state.route='avui';render();toast('Demo restablerta')};
nav=function(){const html=NAV.map(([r,t])=>`<a href="#${r}" class="${state.route===r?'on':''}" onclick="go('${r}');return false">${t}${r==='bustia'&&statsV().exc?`<span class="n">${statsV().exc}</span>`:''}</a>`).join('');$('#side').innerHTML=`<div class="brand"><img src="${LOGO}" alt="Galán"><small>COMPRES · AUTOMATITZACIÓ</small></div>${html}<div class="side-foot"><button class="chip" onclick="resetDemo()">Reiniciar demo</button></div>`;$('#mob').innerHTML=html};
render();

<script id="engine8">
/* Pure deterministic simulation. No network, no actual mail or ERP. */
function makeRun8(tolerance=2){return {tolerance,step:0,running:false,events:[],sent:[],writes:[],seen:[],orders:{A:{promised:'2026-11-12',need:'2026-11-18',price:100,date:null,qty:2,received:0,confirmedQty:0,status:'Pendent'},B:{promised:'2026-11-09',need:'2026-11-14',price:100,date:null,qty:2,received:0,confirmedQty:0,status:'Pendent'},D:{promised:'2026-11-11',need:'2026-11-17',price:100,date:null,qty:2,received:0,confirmedQty:0,status:'Pendent'}},results:{},error:false};}
const script8=[['A','detect'],['A','send'],['A','reply'],['A','validate'],['A','write'],['A','read'],['A','close'],['B','detect'],['B','send'],['B','reply'],['B','validate'],['C','duplicate'],['D','detect'],['D','send'],['D','reply'],['D','validate'],['D','fail'],['E','document'],['E','extract'],['E','compare'],['E','route']];
function tick8(r){if(r.step>=script8.length)return false;const [id,action]=script8[r.step++];const o=r.orders[id];let text='';
if(action==='document'){text='Outlook simulat: arriba ALB-SIM-602.pdf al fil de PC-SIM-E. Document de prova, sense lectura de cap fitxer real.';r.results.E='Albarà rebut · pendent de contrast';}
if(action==='extract'){text='Extracció predeterminada: proveïdor de mostra, albarà ALB-SIM-602, línia DN50, 60 u. declarades. No hi consta preu. Cap dada inferida.';r.results.E='60 u. declarades · preu no disponible';}
if(action==='compare'){text='Contrast per línia i unitat: comanda 80 u. DN50, albarà 60 u. DN50, recepció física verificada 0. Diferència documental: 20 u. Falta data concreta del pendent.';r.results.E='Parcial · 20 u. pendents de confirmar';}
if(action==='route'){text='S’associa el document a PC-SIM-E i es prepara seguiment de 20 u. Compres valida el pendent i magatzem comprova la recepció física. No es modifica estoc, ni es tanca comanda, ni s’aprova factura.';r.results.E='Excepció documental · magatzem / compres';}
if(action==='detect'){text='Sense data confirmada: es prepara la reclamació amb comanda, línia i quantitat.';o.status='Reclamació preparada';}
if(action==='send'){const key='R-'+id+'/1';if(!r.sent.includes(key))r.sent.push(key);text='Correu simulat enviat una sola vegada. Clau '+key+'.';o.status='Esperant resposta';}
if(action==='reply'){r.seen.push('MSG-'+id);text='Resposta fictícia rebuda al mateix fil: 2 unitats, 16/11/2026, '+(id==='B'?'107':'101')+' EUR/u.';o.status='Resposta rebuda';}
if(action==='validate'){const proposed=id==='B'?107:101;const delta=Math.round((proposed/o.price-1)*10000)/100;const ok=delta<=r.tolerance&&'2026-11-16'<=o.need;text='Preu '+o.price+' → '+proposed+' EUR/u (+'+delta+' %). Límit de prova: '+r.tolerance+' %. '+(ok?'Dins de regla; data, quantitat i identitat de mostra coherents.':'Fora de regla: NO s’accepta. Decisió de compres.');if(!ok){o.status='Revisió humana';r.results[id]='Aturat · +7 % fora del límit';}else{o.status='Validat, falta ACK';o.validated=true;}}
if(action==='write'&&!o.validated){r.events.push({id,action:'blocked',text:'No s’escriu: falta validació.'});return true;}
if(action==='close'&&!o.verified){r.events.push({id,action:'blocked',text:'No es tanca: falta ACK.'});return true;}
if(action==='write'){o.price=101;o.date='2026-11-16';o.confirmedQty=2;o.status='Escrit, falta relectura';r.writes.push('ACK-'+id);text='ERP simulat actualitzat. ACK-'+id+': preu 101 EUR/u, data 16/11/2026, 2 unitats. Recepció: 0.';}
if(action==='read'){o.verified=r.writes.includes('ACK-'+id)&&o.price===101&&o.date==='2026-11-16'&&o.confirmedQty===2;text='Relectura de l’ERP simulat: 101 EUR/u, 16/11/2026, 2 unitats confirmades. Coincideix amb l’escriptura. Verificat.';o.status=o.verified?'Relectura verificada':'Sense verificació';}
if(action==='close'){o.status='Reclamació tancada';r.results[id]='Tancada · comanda oberta';text='Tancament de la reclamació confirmat. La comanda continua oberta fins a recepció física.';}
if(action==='duplicate'){const duplicate=r.seen.includes('MSG-A');r.results.C=duplicate?'Duplicat bloquejat':'Sense original';text='Torna MSG-A. '+(duplicate?'Ja processat: 0 correus nous i 0 escriptures ERP. Es conserva la traça.':'No hi ha coincidència.');}
if(action==='fail'){r.error=true;o.status='Error ERP · sense ACK';r.results.D='Bloquejada · no es tanca';text='Error de connector simulat: no hi ha ACK. Cap escriptura confirmada i cap tancament. Reintent disponible, sense reenviar correu.';}
r.events.push({id,action,text,minute:(r.step-1)*5});return true;}
function retry8(r){if(!r.error)return false;r.error=false;const o=r.orders.D;o.price=101;o.date='2026-11-16';o.confirmedQty=2;o.verified=true;o.status='Reclamació tancada';r.writes.push('ACK-D');r.results.D='Reintent correcte · tancada';r.events.push({id:'D',action:'retry',minute:r.step*5,text:'Connector recuperat (simulat). ACK-D i relectura coincident: 101 EUR/u, 16/11/2026, 2 unitats. Reclamació tancada; comanda oberta, rebut 0. Cap correu reenviat.'});return true;}

</script>

<script id="theatre8">

const oldReset8=resetDemo;resetDemo=function(){stop8();R8=makeRun8();oldReset8();};

function mxArchive(){const m=mxMail();if(!m)return;const target=m.folder==='archive'?'inbox':'archive';m.folder=target;mxEvent(m.id,target==='archive'?'Fil arxivat. Original i traça conservats.':'Fil restaurat a la safata d’entrada.');MX.selected=null;MX.mobile=false;MX.compose=null;vOutlook9();toast(target==='archive'?'Arxivat. Es pot restaurar des d’Arxiu.':'Fil restaurat.')}
function mxResetAsk(){mxModal(`<h2>Reiniciar la bústia?</h2><p>Es reiniciaran la bústia i l’Autopilot. Es perdran els esborranys, enviats i canvis locals d’aquesta mostra. No afecta els altres casos d’Avui ni cap dada real.</p><button class="mxbtn primary" onclick="mxCloseModal();mxReset()">Reiniciar mostra</button>`)}
function mxReset(){MX.mail=JSON.parse(JSON.stringify(MXSEED));MX.log=[];MX.drafts=[];MX.counter=0;MX.folder='inbox';MX.selected='x1';MX.query='';MX.filter='all';MX.mobile=false;MX.compose=null;MX.guided=false;mxSave();vOutlook9();toast('Només la bústia de mostra s’ha reiniciat.')}
function mxRows(){let list=MX.folder==='drafts'?MX.drafts.map(d=>({...d,name:'Esborrany de Compres',email:d.to,kind:'draft',label:'No enviat',tone:'amber',folder:'drafts',time:'Local',unread:false})):MX.mail.filter(m=>MX.folder==='flagged'?m.flag:MX.folder==='review'?['price','delay','unmatched','cancel','invoice','alternative','albara','document'].includes(m.kind)&&m.folder==='inbox':MX.folder==='documents'?m.file&&m.folder==='inbox':m.folder===MX.folder);if(MX.filter==='unread')list=list.filter(m=>m.unread);if(MX.filter==='attachments')list=list.filter(m=>m.file);const q=MX.query.trim().toLocaleLowerCase('ca');if(q)list=list.filter(m=>[m.name,m.email,m.subject,m.body,m.order,m.ref,m.file].join(' ').toLocaleLowerCase('ca').includes(q));return list}
function mxDraft(id){const d=MX.drafts.find(x=>x.id===id);if(!d)return;MX.selected=d.source;MX.compose={...d};MX.mobile=true;MX.tab='summary';vOutlook9()}
function mxPrepare(){const m=mxMail();if(!m||['duplicate','info','sent'].includes(m.kind))return;const d=MX.drafts.find(x=>x.source===m.id);MX.compose=d?{...d}:{id:null,source:m.id,to:m.email,subject:'RE: '+m.subject,body:m.draft};vOutlook9();document.getElementById('mxcomposer')?.scrollIntoView({behavior:'smooth',block:'center'})}
function mxNew(){MX.selected=null;MX.mobile=true;MX.compose={id:null,source:null,to:'proveidor@exemple.example',subject:'Consulta de compres · mostra',body:'Bon dia,\n\n[Escriu una consulta de prova. No s’enviarà fora d’aquesta pantalla.]\n\nCompres · entorn de demostració'};vOutlook9()}
function mxSaveDraft(){const d=MX.compose;if(!d)return;if(!d.to.trim()||!d.subject.trim()||!d.body.trim()){toast('Completa destinatari, assumpte i missatge.');return}if(!d.id)d.id='d'+(++MX.counter);const old=MX.drafts.findIndex(x=>x.id===d.id);const copy=JSON.parse(JSON.stringify(d));if(old>=0)MX.drafts[old]=copy;else MX.drafts.unshift(copy);mxEvent(d.source||d.id,'Esborrany desat localment. No enviat.');mxSave();toast('Esborrany desat. Disponible a Esborranys.');vOutlook9()}
function mxSendAsk(){const d=MX.compose;if(!d||!d.to.trim()||!d.subject.trim()||!d.body.trim()){toast('Completa el missatge abans de simular-lo.');return}mxModal(`<h2>Simular enviament?</h2><p>Es crearà un registre només en aquesta demo. Cap correu sortirà a Internet.</p><div class="mxnotice"><b>Per a:</b> ${mxEscape(d.to)}<br><b>Assumpte:</b> ${mxEscape(d.subject)}</div><p>Revisa el text abans de continuar.</p><div class="mxbody">${mxEscape(d.body)}</div><div class="mxactions"><button class="mxbtn primary" onclick="mxSend()">Confirmar simulació</button><button class="mxbtn" onclick="mxCloseModal()">Tornar a editar</button></div>`)}
function mxSend(){const d=MX.compose;if(!d)return;const id='sent'+(++MX.counter);MX.mail.unshift({id,name:'Compres · mostra',email:d.to,subject:d.subject,body:d.body,time:'Local',kind:'sent',label:'Enviat simulat',tone:'green',folder:'sent',unread:false,order:MX.mail.find(m=>m.id===d.source)?.order||null,ref:'Resposta manual de prova',qty:null,docqty:null,price:null,date:'No aplica',need:'No aplica',owner:'Compres',impact:'Cap comunicació externa',source:d.body,finding:'Registre local d’una simulació manual. No acredita enviament ni lliurament real.',parent:d.source});MX.drafts=MX.drafts.filter(x=>x.id!==d.id);mxEvent(d.source||id,'Resposta simulada manualment. Registre a Enviats; cap enviament real.');MX.compose=null;mxCloseModal();MX.folder='sent';MX.selected=id;MX.mobile=true;mxSave();vOutlook9();toast('Simulació registrada a Enviats. 0 correus reals.')}
function mxProcess(){const m=mxMail();if(!m||m.processed)return;if(V.paused){toast('Motor en pausa. Reprèn-lo a Més → Autonomia.');return}m.processed=true;if(m.kind==='confirm'){m.result='Confirmació de mostra verificada';mxEvent(m.id,'MSG-X2 vinculat a PC-SIM-A / DN25. Regla +1 % ≤ +2 %, 2 u. i data 16/11 dins de necessitat 18/11.');mxEvent(m.id,'ERP fictici: ACK-MX-A i relectura coincident (101 €/u., 2 u., 16/11). Recepció física: 0. No modifica l’ERP real ni els casos independents d’Avui.');}else if(m.kind==='albara'){m.result='Document associat · recepció pendent';mxEvent(m.id,'ALB-SIM-602 associat a PC-SIM-E / DN50. 60 u. documentals de 80 demanades; 20 pendents.');mxEvent(m.id,'Tasca local de comprovació assignada a Magatzem. Estoc intacte. Cap factura aprovada.');}else if(m.kind==='duplicate'){m.result='Duplicat bloquejat';mxEvent(m.id,'ALB-SIM-602 ja identificat a x1. 0 quantitats acumulades, 0 escriptures i 0 respostes noves.');}else{m.result='Revisió humana requerida';mxEvent(m.id,'Regla bloquejant: '+m.finding);mxEvent(m.id,'Assignació local: '+m.owner+'. Cap canvi de preu, data, article, factura o cancel·lació executat.');}mxSave();vOutlook9()}
function mxAssign(value){const m=mxMail();if(!m)return;m.owner=value;mxEvent(m.id,'Responsable de prova: '+value+'. No s’ha notificat ningú.');vOutlook9()}
function mxModal(html){document.querySelector('#mxmodal')?.remove();const d=document.createElement('div');d.id='mxmodal';d.className='mxmodal';d.innerHTML=`<section class="mxmodalbox" role="dialog" aria-modal="true" aria-label="Diàleg de demostració"><button class="mxbtn" onclick="mxCloseModal()" style="float:right">Tancar</button>${html}</section>`;document.body.appendChild(d);d.querySelector('button')?.focus()}
function mxCloseModal(){document.querySelector('#mxmodal')?.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')mxCloseModal()});
function mxAttachment(){const m=mxMail();if(!m?.file)return;const isA=['albara','duplicate','unmatched'].includes(m.kind);mxModal(`<h2>Vista del document de mostra</h2><p class="mxmeta">${mxEscape(m.file)} · representació HTML, no és un PDF real processat</p><div class="mxdoc"><div class="stamp">DOCUMENT FICTICI · SENSE VALOR COMERCIAL</div><h3>${isA?'ALBARÀ':m.kind==='invoice'?'FACTURA':m.kind==='alternative'?'FITXA TÈCNICA':'CONFIRMACIÓ'}</h3><p><b>${mxEscape(m.name)}</b><br>Destinatari: empresa de mostra<br>Referència: ${mxEscape(m.file)}<br>Comanda: ${mxEscape(m.order||'No indicada')}</p><div class="mxline"><b>Article</b><span>${mxEscape(m.ref)}</span></div><div class="mxline"><b>Quantitat declarada</b><span>${m.docqty??'No indicada'} ${m.docqty!=null?'u.':''}</span></div><div class="mxline"><b>Preu unitari</b><span>${mxMoney(m.price)}</span></div><div class="mxline"><b>Data indicada</b><span>${mxEscape(m.date)}</span></div>${m.kind==='invoice'?'<p>Base de comanda: 1.440,00 €<br>Transport: 42,00 €<br>Total de mostra: 1.482,00 €</p>':''}<p>${mxEscape(m.source)}</p><div class="mxnotice">${isA?'Aquest document no acredita recepció física. No s’actualitza estoc ni s’aprova cap factura.':'Els camps no indicats queden buits. Cap dada extreta per IA real.'}</div></div>`)}
function mxContext(m){let body='';if(MX.tab==='lines'){body=`<h3>Comanda ↔ document de mostra</h3><div class="mxline"><b>Referència</b><span>${mxEscape(m.ref)}</span></div><div class="mxline"><b>Demanat</b><span>${m.qty??'Desconegut'} ${m.qty!=null?'u.':''}</span></div><div class="mxline"><b>Declarat al correu/document</b><span>${m.docqty??'No indicat'} ${m.docqty!=null?'u.':''}</span></div><div class="mxline"><b>Pendent documental</b><span>${m.qty!=null&&m.docqty!=null?Math.max(0,m.qty-m.docqty)+' u.':'No calculable'}</span></div><div class="mxline"><b>Preu anterior → nou</b><span>${mxMoney(m.oldprice)} → ${mxMoney(m.price)}</span></div><div class="mxline"><b>Data prevista / necessitat</b><span>${mxEscape(m.date)} / ${mxEscape(m.need)}</span></div><div class="mxnotice">Confirmació i expedició no són recepció. En els casos nous de la bústia no hi ha cap recepció física verificada. No s’afegeixen unitats a l’estoc.</div>`}else if(MX.tab==='trace'){const logs=MX.log.filter(x=>x.id===m.id||x.id===m.parent);body=`<h3>Traçabilitat de la mostra</h3><ol class="mxlog"><li><b>01 · Original conservat</b>Missatge ${mxEscape(m.id.toUpperCase())} · ${mxEscape(m.email)} · ${mxEscape(m.order||'sense comanda segura')}</li><li><b>02 · Evidència</b>${mxEscape(m.source)}</li>${logs.map((l,i)=>`<li><b>${String(i+3).padStart(2,'0')} · Acció local #${l.seq}</b>${mxEscape(l.text)}</li>`).join('')}</ol><p class="mxmeta">Seqüència de prova, no marca de temps de producció. Dades desades només en aquest navegador.</p>`}else{body=`<h3>${mxEscape(m.result||m.finding)}</h3>${m.result?`<p>${mxEscape(m.finding)}</p>`:''}<blockquote class="mxsource">“${mxEscape(m.source)}”<br><small>Evidència literal del correu fictici</small></blockquote><div class="mxfacts"><div><span>Comanda</span><b>${mxEscape(m.order||'Sense vincular')}</b></div><div><span>Responsable</span><b>${mxEscape(m.owner)}</b></div><div><span>Data prevista</span><b>${mxEscape(m.date)}</b></div><div><span>Necessitat</span><b>${mxEscape(m.need)}</b></div></div><p><b>Impacte:</b> ${mxEscape(m.impact)}</p><label class="mxmeta">Assignar revisió local<select aria-label="Responsable de revisió" onchange="mxAssign(this.value)" style="display:block;width:100%;padding:8px;margin-top:5px;border:1px solid #cad7e5;border-radius:4px">${[...new Set([m.owner,'Compres','Compres + Magatzem','Compres + Vendes','Compres + Comptabilitat','Compres + Oficina tècnica'])].map(v=>`<option ${v===m.owner?'selected':''}>${mxEscape(v)}</option>`).join('')}</select></label><div class="mxactions">${m.kind!=='sent'&&m.kind!=='info'?`<button class="mxbtn primary" onclick="mxProcess()" ${m.processed?'disabled':''}>${m.processed?'Contrast registrat':m.kind==='confirm'?'Simular regla i verificar':m.kind==='duplicate'?'Comprovar duplicat':'Contrastar i registrar'}</button>`:''}${!['duplicate','info','sent'].includes(m.kind)?'<button class="mxbtn" onclick="mxPrepare()">Preparar resposta</button>':''}</div><div class="mxnotice">${m.kind==='confirm'?'Regla de mostra aprovada només per a la simulació. No és una autorització de Galán.':'Les excepcions no s’accepten soles. La resposta queda en esborrany fins a la revisió.'}</div>`}return `<section class="mxinsight"><div class="mxinsighthead"><b>Assistència de compres</b><span class="mxlabel ${m.tone}">${mxEscape(m.label)}</span></div><div class="mxtabs">${[['summary','Resum i decisió'],['lines','Línies'],['trace','Traça']].map(([k,v])=>`<button class="${MX.tab===k?'active':''}" onclick="MX.tab='${k}';vOutlook9()">${v}</button>`).join('')}</div><div class="mxcontent">${body}</div></section>`}
function mxComposeView(){const d=MX.compose;return !d?'':`<section class="mxcomposer" id="mxcomposer"><h3>${d.id?'Esborrany desat':'Preparar resposta'} · només simulació</h3><label>Per a<input aria-label="Destinatari de prova" value="${mxEscape(d.to)}" oninput="MX.compose.to=this.value"></label><label>Assumpte<input aria-label="Assumpte de prova" value="${mxEscape(d.subject)}" oninput="MX.compose.subject=this.value"></label><textarea aria-label="Text de resposta" oninput="MX.compose.body=this.value">${mxEscape(d.body)}</textarea><footer><button class="mxbtn primary" onclick="mxSaveDraft()">Desar esborrany</button><button class="mxbtn" onclick="mxSendAsk()">Simular enviament…</button><button class="mxbtn" onclick="MX.compose=null;vOutlook9()">Tancar editor</button></footer><div class="mxnotice">Revisió humana abans d’enviar. No hi ha cap connector SMTP ni Microsoft Graph; cap destinatari rep res.</div></section>`}
function mxReader(){const m=mxMail();if(!m)return `<div class="mxreader"><button class="mxbtn mxback" onclick="MX.mobile=false;vOutlook9()">← Tornar a la llista</button>${MX.compose?mxComposeView():'<div class="mxempty"><h2>Selecciona un fil</h2><p>Correu original, document i decisió de compres, en un sol lloc.</p></div>'}</div>`;return `<article class="mxreader"><div class="mxactions" style="margin:0 0 18px"><button class="mxbtn mxback" onclick="MX.mobile=false;vOutlook9()">← Tornar a la llista</button><button class="mxbtn small" onclick="mxArchive()">${m.folder==='archive'?'Restaurar':'Arxivar'}</button><button class="mxbtn small" onclick="mxFlag()">${m.flag?'★ En seguiment':'☆ Seguiment'}</button><button class="mxbtn small" onclick="mxUnread()">${m.unread?'Marcar llegit':'Marcar no llegit'}</button></div><h2>${mxEscape(m.subject)}</h2><div class="mxmeta">Fil de mostra · ${m.parent||m.id} · ${m.folder==='sent'?'ENVIAT SIMULAT · cap lliurament real':'Divendres 13/11/2026 · rellotge de demostració'}</div><div class="mxsender"><span class="mxavatar">${mxEscape(m.name.slice(0,2).toUpperCase())}</span><div><b>${mxEscape(m.name)}</b><span class="mxmeta">${mxEscape(m.email)}<br>${m.folder==='sent'?'De: compres@empresa.example':'Per a: compres@empresa.example'}</span></div></div>${m.order?`<details style="margin:0 0 12px"><summary>Missatge anterior del fil · consulta original</summary><div class="mxbody">Compres · empresa de mostra\nBon dia, ens confirmeu l’estat de ${mxEscape(m.order)} i la data prevista?\n[Antecedent fictici per a la demostració del fil]</div></details>`:''}<div class="mxbody">${mxEscape(m.body)}</div>${m.file?`<button class="mxattachment" onclick="mxAttachment()"><span class="mxpdf">PDF</span><span><b>${mxEscape(m.file)}</b><small>Obrir representació del document fictici</small></span></button>`:''}${m.folder==='sent'?'':mxContext(m)}${mxComposeView()}</article>`}
function vOutlook9(){if(MX.guided){legacyOutlook10();document.querySelector('#view').insertAdjacentHTML('afterbegin','<button class="mxbtn primary" style="margin-bottom:16px" onclick="outlookPause9();MX.guided=false;vOutlook9()">← Tornar a la bústia completa</button>');return}const rows=mxRows();const folders=[['inbox','Safata d’entrada',MX.mail.filter(m=>m.folder==='inbox').length],['drafts','Esborranys',MX.drafts.length],['sent','Enviats simulats',MX.mail.filter(m=>m.folder==='sent').length],['archive','Arxiu',MX.mail.filter(m=>m.folder==='archive').length],['flagged','En seguiment',MX.mail.filter(m=>m.flag).length],['review','Revisió de compres',MX.mail.filter(m=>['price','delay','unmatched','cancel','invoice','alternative','albara','document'].includes(m.kind)&&m.folder==='inbox').length],['documents','Amb documents',MX.mail.filter(m=>m.file&&m.folder==='inbox').length]];const title=folders.find(f=>f[0]===MX.folder)?.[1]||'Correu';document.querySelector('#view').innerHTML=`<div class="heading"><div><h1>Outlook · l’espai de treball de compres</h1><div class="sub">Correu, comanda i document. Del missatge a una decisió comprovable.</div></div><button class="mxbtn" onclick="MX.guided=true;vOutlook9()">Recorreguts guiats v9</button></div><div class="mxnotice" style="margin:0"><b>SIMULACIÓ INDEPENDENT.</b> Missatges, documents i proveïdors ficticis. Sense Microsoft ni IA connectats. Proposta per validar, no descripció dels sistemes actuals de Galán.</div><section class="mx ${MX.mobile?'showread':''}"><div class="mxbar"><strong>▦ Correu de compres</strong><label class="mxsearch"><span aria-hidden="true">⌕</span><input id="mxsearch" type="search" aria-label="Cerca a la bústia" placeholder="Cerca en aquesta carpeta" value="${mxEscape(MX.query)}" oninput="mxQuery(this.value)"></label><span>COMPRES · MOSTRA</span></div><div class="mxtools"><button class="mxbtn primary" onclick="mxNew()">+ Nou missatge</button><select class="mxmobilefolders" aria-label="Carpeta de correu" onchange="mxFolder(this.value)">${folders.map(([k,t,n])=>`<option value="${k}" ${k===MX.folder?'selected':''}>${t} (${n})</option>`).join('')}</select><button class="mxbtn" onclick="mxModal('<h2>Entorn desconnectat</h2><p>La bústia es carrega amb dades fictícies locals. No hi ha sincronització de Microsoft, SMTP, ERP ni IA.</p><p>Un desplegament real exigeix validar amb IT el servidor de correu, permisos, identitat d’enviament, dades i accions autoritzades.</p>')">Sense connexió</button><button class="mxbtn" onclick="mxResetAsk()">Reiniciar</button></div><div class="mxgrid"><nav class="mxfolders" aria-label="Carpetes de correu"><div class="mxaccount"><b>Compres · mostra</b>compres@empresa.example<br>Perfil compartit fictici</div>${folders.map(([k,t,n],i)=>`${i===4?'<span class="mxsection">VISTES DE TREBALL</span>':''}<button class="mxfolder ${MX.folder===k?'active':''}" onclick="mxFolder('${k}')"><span>${t}</span><b>${n}</b></button>`).join('')}<div class="mxnotice">Només dades locals<br>0 enviaments reals</div></nav><section class="mxlist" aria-label="Llista de missatges"><div class="mxlisthead"><b>${title}</b><span class="mxmeta">${rows.length} fils</span></div><div class="mxfilters">${[['all','Tots'],['unread','No llegits'],['attachments','Adjunts']].map(([k,v])=>`<button class="${MX.filter===k?'active':''}" onclick="mxFilter('${k}')">${v}</button>`).join('')}</div><div class="mxrows">${rows.map(m=>`<button class="mxrow ${m.unread?'unread':''} ${MX.selected===m.id?'selected':''}" onclick="${MX.folder==='drafts'?`mxDraft('${m.id}')`:`mxSelect('${m.id}')`}"><span class="mxrowtop"><span class="sender">${mxEscape(m.name)}</span><time>${mxEscape(m.time)}</time></span><h3>${m.flag?'★ ':''}${mxEscape(m.subject)}</h3><p>${mxEscape(m.body.split('\n').filter(Boolean)[1]||m.body)}</p><span class="mxlabel ${m.tone}">${mxEscape(m.label)}</span><span class="mxmeta"> ${m.file?'▤ ':''}${mxEscape(m.order||'Sense comanda')}</span></button>`).join('')||'<div class="mxempty">Cap fil en aquesta vista.<br>Canvia el filtre o la cerca.</div>'}</div></section>${mxReader()}</div></section><details class="mxguide"><summary>Guió de demostració i límits abans de connectar res</summary><p><b>Prova-ho:</b> albarà parcial → document → Línies → contrastar → preparar resposta → desar → Esborranys → simular enviament → Enviats. Després prova preu fora de regla, duplicat i document sense comanda.</p><p>Fabricació de maquinària tèxtil: mecanitzat, motors, automatització i muntatge per ordres de fabricació. Escenaris ficticis, no dades ni decisions de Galán. Els tres conjunts (Avui, Bústia de compres i aquesta bústia) són mostres independents; no comparteixen una base ERP.</p><p><b>Validar amb IT:</b> Outlook és el client, no el servidor. Confirmar Microsoft 365/Exchange i tipus de bústia, abast d’accés i consentiment. Lectura, esborranys i enviament són permisos diferents (Mail.Read, Mail.ReadWrite i Mail.Send). No hi ha permisos concedits en aquesta demo. Primer observació i contrast; després regles acordades. Eines gratuïtes aquí no impliquen producció gratuïta.</p><p><a href="https://learn.microsoft.com/en-us/graph/api/resources/mail-api-overview?view=graph-rest-1.0" target="_blank" rel="noopener">Correu via Microsoft Graph</a> · <a href="https://learn.microsoft.com/en-us/graph/permissions-reference" target="_blank" rel="noopener">Permisos</a> · <a href="https://learn.microsoft.com/en-us/graph/outlook-share-messages-folders" target="_blank" rel="noopener">Bústies compartides</a></p><button class="mxbtn" onclick="MX.guided=true;vOutlook9()">Obrir els dos recorreguts guiats v9</button></details>`}
