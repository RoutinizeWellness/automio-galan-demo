<style>

.navicon{display:flex;color:var(--mute)}.on .navicon{color:var(--navy)}

.independent{margin-top:12px;font-size:10px;color:var(--mute2);line-height:1.55}

.version{font-size:11px;color:var(--mute);letter-spacing:.05em;font-weight:600}
.heading{margin-bottom:22px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--mute2);margin-bottom:7px}
h1{font-size:23px;line-height:1.25;font-weight:700;letter-spacing:-.02em;margin:0;color:var(--ink)}
h2{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0 0 10px;color:var(--ink)}
h3{font-size:13px;color:var(--ink);font-weight:650}
.sub{color:var(--mute);font-size:13px;margin:6px 0 0;max-width:70ch}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:15px}
.snapshot{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:#fff;white-space:nowrap}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1.5fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--sh)}
.kpi b{font-size:28px;display:block;line-height:1.1;color:var(--ink);font-weight:700;letter-spacing:-.02em}.kpi span{color:var(--mute);font-size:12.5px}
.kpi.bad b{color:var(--acc)}.kpi.warn b{color:var(--amb)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.t-red{background:var(--accbg);color:#b42318}.t-amb{background:var(--ambbg);color:var(--amb)}.t-grn{background:var(--grnbg);color:var(--grn)}.t-blu{background:var(--blubg);color:var(--blu)}.t-gry{background:var(--grybg);color:#475467}
.mut{color:var(--mute)}.small{font-size:12.5px}
.item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2);align-items:flex-start}.item:last-child{border:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}.d-red{background:var(--acc)}.d-amb{background:#f79009}.d-blu{background:var(--blu)}.d-gry{background:#a7b0bf}.d-grn{background:#12b76a}
.item .b{flex:1;min-width:0}
button.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:9px;padding:8px 15px;cursor:pointer;transition:filter .12s,background .12s}
button.btn:hover{filter:brightness(1.12)}
button.btn.ghost{background:#fff;color:var(--ink2);border-color:#d0d5dd}button.btn.ghost:hover{background:var(--grybg);filter:none}
button.btn.soft{background:var(--navybg);color:var(--navy);border-color:transparent}
button:disabled{opacity:.45;cursor:default}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc;font-weight:650}
td{padding:13px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:#f8fafc}
tr.active-row td{background:var(--navybg)}
.tw{overflow-x:auto}.card.tw{padding:0}
.card.tw table td:first-child,.card.tw table th:first-child{padding-left:18px}.card.tw table td:last-child,.card.tw table th:last-child{padding-right:18px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:550;color:var(--ink2)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools #chips{display:flex;gap:6px;flex-wrap:wrap}
input,select,textarea{font:inherit;font-size:13px;border:1px solid #d0d5dd;border-radius:9px;padding:8px 11px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #b2c3e4;outline-offset:0;border-color:var(--navy)}
input[type=search]{min-width:230px;flex:1}
textarea{width:100%;min-height:200px;line-height:1.6;resize:vertical}
.bar{height:6px;background:#edf0f4;border-radius:99px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.bar.risk i{background:var(--acc)}
.tl{margin:10px 0 0;padding:0;list-style:none;border-left:2px solid var(--line)}.tl li{padding:0 0 10px 14px;position:relative;font-size:13px}.tl li:before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--navy)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:12px 0;font-size:13px}.kv div:nth-child(odd){color:var(--mute)}
.drawer{position:fixed;inset:0;background:rgba(16,24,40,.44);display:none;z-index:20}.drawer.on{display:block}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(640px,100%);background:#fff;padding:26px;overflow:auto;box-shadow:var(--sh2)}
.x{float:right;border:0;background:var(--grybg);border-radius:9px;width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--mute)}
.x:hover{background:#e5e9ef}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:40;display:none;box-shadow:var(--sh2);max-width:90%;text-align:center}
.why{background:#f8fafc;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:13px;line-height:1.6;color:var(--ink2)}
.mailprev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:0;font-size:13px;margin-top:12px;overflow:hidden}
.mailprev .mh{color:var(--mute);font-size:12px;background:#fafbfc;border-bottom:1px solid var(--line2);padding:10px 14px;margin:0;line-height:1.7}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:none;font:inherit;font-size:13px;padding:10px 14px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:550}
.tabs button.on{color:var(--navy);font-weight:650;border-bottom-color:var(--acc)}
.banner{background:var(--accbg);border:1px solid #f5c6c3;border-radius:10px;padding:11px 15px;margin-bottom:16px;font-size:13px;display:flex;gap:10px;align-items:flex-start}.banner b{color:#b42318}
.banner.amber{background:var(--ambbg);border-color:#f5ddba}.banner.amber b{color:var(--amb)}
.dec{font-size:12px;color:var(--grn);font-weight:600}.dec.rej{color:#b42318}
.src-list a{color:var(--blu);word-break:break-all}.src-list li{margin:5px 0}
.ofcard .lines li{margin:6px 0;list-style:none}.ofcard ul{padding:0;margin:10px 0}
.empty{padding:26px 8px;color:var(--mute)}
.queue-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:0;gap:26px;align-items:center}
.queue-tabs button{font:inherit;font-size:12.5px;background:none;border:0;color:var(--mute);padding:12px 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:550}
.queue-tabs button.on{color:var(--navy);border-color:var(--navy);font-weight:650}
.queue-tabs b{font-size:10.5px;background:var(--grybg);border-radius:99px;padding:2px 7px;margin-left:6px;font-weight:650;color:var(--ink2)}
.queue-note{margin-left:auto;font-size:10.5px;color:var(--mute2);white-space:nowrap}
.workbench{display:grid;grid-template-columns:minmax(300px,35%) minmax(0,1fr);border:1px solid var(--line);border-top:0;min-height:600px;background:#fff;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.queue{border-right:1px solid var(--line);background:#fff}
.queue-search{padding:14px 16px;border-bottom:1px solid var(--line2)}
.queue-search input{width:100%;min-width:0;background:#f8fafc;border:1px solid var(--line);font-size:12.5px}
.queue-row{display:block;width:100%;text-align:left;background:none;color:var(--ink);border:0;border-bottom:1px solid var(--line2);border-left:3px solid transparent;padding:16px 18px 15px 15px;font:inherit;cursor:pointer;transition:background .12s}
.queue-row:hover{background:#fafbfc}.queue-row.selected{background:var(--navybg);border-left-color:var(--navy)}
.queue-meta{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--mute2);margin-bottom:7px;font-weight:600;letter-spacing:.02em}
.priority{color:var(--mute)}.priority.urgent{color:#b42318}.priority.urgent:before{content:' ';display:inline-block;width:5px;height:5px;background:var(--acc);border-radius:50%;margin:0 5px 2px 0}
.queue-row strong{font-size:13px;font-weight:650;display:block;line-height:1.45;color:var(--ink);letter-spacing:-.005em}
.queue-supplier{font-size:11px;color:var(--mute);margin-top:6px}
.queue-brief{font-size:11.5px;color:var(--mute);line-height:1.55;margin-top:5px}
.queue-bottom{font-size:10.5px;color:var(--mute2);display:flex;justify-content:space-between;margin-top:12px}.queue-bottom span{color:var(--blu);font-weight:600}
.detail-toolbar{display:flex;justify-content:space-between;padding:15px 24px;border-bottom:1px solid var(--line2);font-size:9.5px;letter-spacing:.1em;color:var(--mute2);font-weight:650}
.detail-body{padding:24px 26px 30px}
.detail h2{font-size:19px;line-height:1.4;font-weight:650;letter-spacing:-.01em}
.detail .kv{font-size:12.5px;grid-template-columns:105px 1fr;margin:18px 0;gap:8px}
.detail .act{border-top:1px solid var(--line2);padding-top:16px;margin-top:22px}
.detail .small.mut{font-size:10.5px;color:var(--mute2)}
.detail label{font-size:12.5px}.detail label .small{font-size:11px}
.decision-receipt{border-left:3px solid #12b76a;padding:12px 15px;background:var(--grnbg);border-radius:0 8px 8px 0;margin-top:20px;font-size:12px;line-height:1.8}
.blank{padding:70px 35px;color:var(--mute);font-size:12.5px}
.material-detail{margin-top:20px;padding:22px}
.material-row{display:flex;align-items:flex-start;gap:14px;border-bottom:1px solid var(--line2);padding:14px 0;font-size:13px}
.material-row:last-of-type{border-bottom:0}
.material-row .tag{min-width:64px;justify-content:center}
.material-row .mut{font-size:11.5px;margin-top:3px}
.production-table{min-width:620px}
nav.mob{display:none}

.k4{grid-template-columns:1fr 1fr}.k3{grid-template-columns:1fr}.two{grid-template-columns:1fr}.hide-m{display:none}
.queue-tabs{gap:20px;overflow:auto}.queue-tabs button{font-size:12px}.queue-note{display:none}
.workbench{grid-template-columns:1fr;min-height:0}.queue{border-right:0}.queue-row{padding:16px}.queue-row strong{font-size:13.5px}.queue-meta,.queue-supplier,.queue-brief{font-size:11.5px}.queue-bottom{font-size:11px}.detail{display:none}
.queue-search{padding:13px}.queue-search input{font-size:16px}

.act{gap:8px}

.kv{grid-template-columns:110px 1fr}

nav.mob a .n{display:none!important}
.tools{display:block}.tools input{width:100%;max-width:none;font-size:16px}.tools #chips{margin-top:12px}
.card.tw{overflow:auto}
.material-detail{padding:16px}.material-detail .headrow{display:block}.material-row{gap:12px;font-size:12.5px}.material-row .mut{font-size:11.5px}.production-table td{padding:12px}
table.cmdt,table.cmdt tbody,table.cmdt tr,table.cmdt td{display:block;width:100%}table.cmdt thead{display:none}table.cmdt tr{padding:14px 12px;border-bottom:1px solid var(--line)}table.cmdt td,table.cmdt td.hide-m{padding:4px 0;border:0;display:block;font-size:12.5px}table.cmdt td:first-child{font-weight:650;font-size:13.5px}table.cmdt td.hide-m:before{content:'Data: ';color:var(--mute)}}

</style></head><body>

const $=s=>document.querySelector(s);
const LS=C.key+'-v4';
let state={route:'avui',tab:'prov',q:'',chip:'all'};
let D; // decisions
try{D=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){D={}}
function saveD(){try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
function go(r,x){state.route=r;if(x&&x.tab)state.tab=x.tab;closeDr();render();window.scrollTo(0,0)}
function navHTML(a){const pend=C.aps.filter(x=>!D[x.id]).length;
 return a.map(([k,t])=>`<a class="${state.route===k?'on':''}" onclick="go('${k}')">${t}${k==='aprovacions'&&pend?`<span class="n">${pend}</span>`:''}</a>`).join('')}
function nav(){$('#side').innerHTML=`<div class="brand"><img src="${C.logo}" alt="${C.name}"><small>ASSISTENT DE COMPRES</small></div>${navHTML(C.nav)}<div class="side-foot">Res no s'envia ni s'actualitza sense aprovació.<br><br><b>Demo independent</b>, no és un producte oficial de ${C.name}. Dades fictícies.</div>`;
 $('#mob').innerHTML=navHTML(C.nav.filter(([k])=>k!=='mes').concat([['mes','Més']]));}
function sup(id){return C.sups[id]||{n:id,c:'',cat:''}}
function ord(id){return C.orders.find(o=>o.id===id)}
function recvPct(o){const q=o.L.reduce((a,l)=>a+l.q,0),r=o.L.reduce((a,l)=>a+l.r,0);return q?Math.round(r/q*100):0}
function ordState(o){const today=C.today,p=recvPct(o);if(p===100)return['Rebuda','t-grn'];const ref=o.cd||o.pd;if(ref<today)return['En retard','t-red'];if(o.cd&&o.cd>o.pd)return['Reprogramada','t-amb'];if(p>0)return['Parcial','t-amb'];if(!o.cd)return['Sense confirmar','t-gry'];return['Confirmada','t-blu']}
function fmtD(d){if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`}
function decided(id){return D[id]}
function kpi(label,val,cls){return `<div class="card kpi ${cls||''}"><b>${val}</b><span>${label}</span></div>`}

/* ---------- AVUI ---------- */
function vAvui(){const pend=C.aps.filter(a=>!D[a.id]);const open=C.orders.filter(o=>recvPct(o)<100).length;const part=C.orders.filter(o=>recvPct(o)>0&&recvPct(o)<100).length;
 let h=`<div class="heading"><h1>Bon dia, ${C.contact}</h1><div class="sub">${C.tagline} Res no s'envia ni es registra sense la teva aprovació.</div></div>`;
 h+=`<div class="grid ${C.of?'k4':'k3'}" style="margin-bottom:14px">${kpi('Aprovacions pendents',pend.length,pend.length?'warn':'')}${kpi('Comandes obertes',open)}${kpi('Recepcions parcials',part)}${C.of?kpi('Ordres de fabricació en risc',C.of.filter(o=>o.risk).length,C.of.some(o=>o.risk)?'bad':''):''}</div>`;
 if(C.alert)h+=`<div class="banner ${C.alert.cls||''}"><span class="dot ${C.alert.cls==='amber'?'d-amb':'d-red'}" style="margin-top:4px"></span><div><b>${esc(C.alert.t)}</b><br>${esc(C.alert.d)} <a href="#" onclick="go('${C.alert.go}');return false" style="color:var(--navy);font-weight:600">${esc(C.alert.link)}</a></div></div>`;
 h+=`<div class="grid two"><div class="card"><h2>Decisions pendents</h2>`;
 if(!pend.length)h+=`<div class="empty">Tot decidit. Quan entri un correu o canvii una data, la proposta apareixerà aquí.</div>`;
 pend.slice(0,3).forEach(a=>{h+=`<div class="item"><span class="dot ${a.side==='produccio'?'d-blu':a.urg?'d-red':'d-amb'}"></span><div class="b"><span class="tag ${TYPE_TAG[a.type]||'t-gry'}">${a.type}</span>${a.side?` <span class="tag t-blu">${a.side==='produccio'?'Producció':'Compres'}</span>`:''}<div style="margin-top:4px"><b>${esc(a.title)}</b></div><div class="small mut">${esc(a.brief)}</div></div><button class="btn ghost" onclick="go('aprovacions');setTimeout(()=>openAp('${a.id}'),60)">Revisar</button></div>`});
 h+=`</div><div class="card"><h2>Agenda de la setmana</h2>${C.agenda.map(a=>`<div class="item"><span class="dot d-gry"></span><div class="b"><b>${esc(a[0])}</b><div class="small mut">${esc(a[1])}</div></div><span class="small mut" style="white-space:nowrap">${esc(a[2])}</span></div>`).join('')}</div></div>`;
 $('#view').innerHTML=h}

/* ---------- APROVACIONS ---------- */
const TYPE_TAG={'Seguiment':'t-amb','Canvi de data':'t-red','Factura':'t-red','Recepció':'t-blu','Substitució':'t-amb','Documentació':'t-amb','Preu':'t-red','Comanda nova':'t-grn','Sincronització':'t-blu','Reclamació':'t-red'};
function vApprov(){const pend=C.aps.filter(a=>!D[a.id]);const done=C.aps.filter(a=>D[a.id]);
 let h=`<div class="heading"><h1>Aprovacions</h1><div class="sub">El sistema prepara i proposa; tu decideixes cas per cas. Aprovar registra la decisió a l'historial. En aquesta demo no s'envia res.</div></div>`;
 if(!pend.length)h+=`<div class="card empty">Cap proposta pendent. Totes les decisions estan preses.</div>`;
 pend.forEach(a=>{const o=ord(a.order);h+=`<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:230px"><span class="tag ${TYPE_TAG[a.type]||'t-gry'}">${a.type}</span>${a.side?` <span class="tag t-blu">${a.side==='produccio'?'Decideix producció':'Decideix compres'}</span>`:''}${a.urg?' <span class="tag t-red">Urgent</span>':''}<h3 style="margin:8px 0 4px;font-size:15px">${esc(a.title)}</h3><div class="small mut">${o?esc(o.id)+(o.proj?` · ${esc(o.proj)}`:'')+(a.of?` · ${a.of}`:''):''}</div><div class="why"><b>Per què ho proposa:</b> ${esc(a.why)}</div></div><button class="btn" onclick="openAp('${a.id}')">Revisar i decidir</button></div></div>`});
 if(done.length){h+=`<div class="card"><h2>Registre de decisions</h2>${done.map(a=>{const d=D[a.id];return `<div class="item"><span class="dot ${d.action==='aprovada'?'d-grn':'d-red'}"></span><div class="b"><b>${esc(a.title)}</b><div class="small"><span class="dec ${d.action==='aprovada'?'':'rej'}">${d.action==='aprovada'?'Aprovada':'Rebutjada'}</span> · ${d.ts}${d.note?` · ${esc(d.note)}`:''}</div></div><button class="btn ghost" onclick="undoAp('${a.id}')">Desfés</button></div>`}).join('')}</div>`}
 $('#view').innerHTML=h}
function openAp(id){const a=C.aps.find(x=>x.id===id);if(!a)return;const o=ord(a.order);const d=D[id];
 let h=`<button class="x" onclick="closeDr()">×</button><span class="tag ${TYPE_TAG[a.type]||'t-gry'}">${a.type}</span>${a.side?` <span class="tag t-blu">${a.side==='produccio'?'Decideix producció':'Decideix compres'}</span>`:''}<h2 style="margin:10px 0 4px">${esc(a.title)}</h2>`;
 if(o)h+=`<div class="kv"><div>Comanda</div><div><a href="#" onclick="closeDr();openOrder('${o.id}');return false" style="color:var(--navy)">${o.id}</a>${o.proj?` · ${esc(o.proj)}`:''}</div><div>Proveïdor</div><div>${esc(sup(o.s).n)}</div><div>Promesa</div><div>${fmtD(o.pd)}${o.cd?` → confirmada ${fmtD(o.cd)}`:' (sense confirmar)'}</div></div>`;
 h+=`<div class="why"><b>Per què ho proposa:</b> ${esc(a.why)}</div>`;
 if(a.opts){h+=`<h3>Opcions</h3>${a.opts.map((op,i)=>`<label style="display:block;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer"><input type="radio" name="opt" value="${i}" ${i===0?'checked':''} style="margin-right:8px"><b>${esc(op.t)}</b><br><span class="small mut" style="margin-left:24px">${esc(op.d)}</span></label>`).join('')}`}
 if(a.draft)h+=`<h3 style="margin-top:18px">Esborrany preparat (editable)</h3><div class="mailprev"><div class="mh">Per a: ${esc(a.draft.to)}<br>Assumpte: ${esc(a.draft.subj)}</div><textarea id="draftbody">${esc(a.draft.body)}</textarea></div>`;
 if(d){h+=`<div class="act"><span class="dec ${d.action==='aprovada'?'':'rej'}">${d.action==='aprovada'?'Aprovada':'Rebutjada'} · ${d.ts}${d.note?' · '+esc(d.note):''}</span><button class="btn ghost" onclick="undoAp('${a.id}')">Desfés</button></div>`}
 else{h+=`<div class="act"><button class="btn" onclick="decideAp('${a.id}','aprovada')">Aprova${a.draft?' i marca per enviar':''}</button>${a.draft?`<button class="btn soft" onclick="decideAp('${a.id}','aprovada',true)">Aprova amb l'edició</button>`:''}<button class="btn ghost" onclick="rejectAsk('${a.id}')">Rebutja</button></div><div class="small mut" style="margin-top:8px">Simulació: aprovar no envia correus ni escriu a cap ERP; només registra la decisió.</div>`}
 $('#pn').innerHTML=h;$('#dr').classList.add('on')}

 h+=`<div class="kv"><div>Emesa</div><div>${fmtD(o.od)}</div><div>Promesa</div><div>${fmtD(o.pd)}</div><div>Confirmada</div><div>${o.cd?fmtD(o.cd):'No confirmada'}</div>${o.of?`<div>Ordre de fabricació</div><div>${esc(o.of)}</div>`:''}${o.imp?`<div>Impacte</div><div>${esc(o.imp)}</div>`:''}</div>`;

 h+=`<h3 style="margin-top:18px">Historial</h3><ul class="tl">${o.ev.map(e=>`<li><span class="mut small">${fmtD(e[0])} · ${esc(e[1])}</span><br>${esc(e[2])}</li>`).join('')}</ul>`;
 h+=`<div class="act"><button class="btn ghost" onclick="mkFollow('${o.id}')">Prepara un seguiment</button></div><div class="small mut" style="margin-top:6px">El seguiment no s'envia: crea una proposta a Aprovacions.</div>`;

 if(!C.aps.some(a=>a.id===newId)){C.aps.unshift({id:newId,type:'Seguiment',order:id,title:'Seguiment de la '+id+' ('+s.n+')',brief:'Proposta creada des del detall de la comanda.',why:'Preparada manualment des de la comanda. Sense confirmació actualitzada, el pla queda en risc.',draft:{to:s.c+' <comercial@proveidor-demo.example>',subj:'Estat de la comanda '+id,body:'Bon dia '+s.c.split(' ')[0]+',\n\nEns podeu confirmar l’estat de la comanda '+id+' i la data d’entrega actualitzada?\n\nGràcies,\n'+C.contact+'\n'+C.name+' (demo)'}})}

vProd=function(){if(!selectedOf)selectedOf=C.of.find(f=>f.risk)?.id||C.of[0].id;const f=C.of.find(x=>x.id===selectedOf);$('#view').innerHTML=`<div class="heading"><div class="eyebrow">FABRICACIÓ / DISPONIBILITAT DE MATERIAL</div><h1>Producció i compres</h1><div class="sub">Ordres de fabricació, materials pendents i decisions compartides.</div></div><div class="card tw"><table class="production-table"><thead><tr><th>Ordre / màquina</th><th>Inici previst</th><th>Lliurament</th><th>Material rebut</th><th>Estat</th></tr></thead><tbody>${C.of.map(o=>`<tr class="row ${o.id===selectedOf?'active-row':''}" onclick="selectedOf='${o.id}';vProd()"><td><b>${o.id}</b><div class="mut small">${esc(o.machine)}</div></td><td>${esc(o.start)}</td><td>${esc(o.due)}</td><td>${o.lines.filter(l=>l.st==='Rebut').length} / ${o.lines.length} necessitats</td><td><span class="tag ${o.risk?'t-red':'t-grn'}">${o.risk?'Material pendent':'En termini'}</span></td></tr>`).join('')}</tbody></table></div><div class="material-detail card"><div class="headrow"><div><div class="eyebrow">MATERIALS DE ${f.id}</div><h2>${esc(f.machine)}</h2></div><span class="small mut">${esc(f.sector)}</span></div>${f.lines.map(l=>`<div class="material-row"><span class="tag ${l.st==='Rebut'?'t-grn':l.st==='Risc'?'t-red':'t-amb'}">${esc(l.st)}</span><div><b>${esc(l.need)}</b><div class="mut">${esc(l.info)}</div></div></div>`).join('')}${f.ap?`<div class="act"><button class="btn" onclick="openAp('${f.ap}')">${D[f.ap]?'Veure la decisió':'Revisar opcions amb compres'}</button></div>`:''}<p class="small mut">No es replanifica cap ordre ni s'actualitza l'ERP. Els canvis es revisen i s'aproven manualment.</p></div>`};
const oldOrders=vOrders;vOrders=function(){oldOrders();$('#view .sub').textContent='Comandes, dates confirmades i recepcions parcials.'};
const oldOB=vOrdersBody;vOrdersBody=function(){oldOB();document.querySelectorAll('#chips .chip').forEach((b,i)=>b.classList.toggle('on',['all','late','part','noc'][i]===state.chip))};
const oldReset=resetAll;resetAll=function(){for(const a of C.aps)localStorage.removeItem(LS+'-draft-'+a.id);localStorage.removeItem(LS+'-custom');C.aps=C.aps.filter(a=>!a.id.startsWith('ap-x-'));queueMode='pending';selectedAp=null;oldReset()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDr()});

const prevMes=vMes;vMes=function(){prevMes();if(state.tab==='real')$('#mb').insertAdjacentHTML('beforeend',`<p class="small mut" style="margin-top:18px">Referències de producte: <a href="https://www.cybrosys.com/odoo/odoo-books/v19/purchase/orders-menu/" target="_blank" rel="noopener">Odoo Purchase</a> · <a href="https://support.sourceday.com/hc/en-us/articles/5031289206292-Managing-POs-from-the-dashboard-accept-update-respond" target="_blank" rel="noopener">SourceDay PO Collaboration</a>. Estructura de llistes, detall i revisió de canvis; implementació pròpia, sense afiliació.</p>`)};

rejectAsk=function(id){const p=activeReview();if(p.querySelector('#rejbox'))return;p.insertAdjacentHTML('beforeend',`<div id="rejbox" style="margin-top:16px"><h3>Motiu del rebuig</h3><input id="rejnote" aria-label="Motiu del rebuig" style="width:100%" placeholder="Opcional"><div class="act"><button class="btn" onclick="decideAp('${id}','rebutjada')">Confirma el rebuig</button></div></div>`);p.querySelector('#rejbox').scrollIntoView({behavior:'smooth'})};

const _pv=new URLSearchParams(location.search);
if(_pv.get('v'))state.route=_pv.get('v');
if(_pv.get('t'))state.tab=_pv.get('t');
render();
if(_pv.get('ap'))openAp(_pv.get('ap'));
if(_pv.get('o'))openOrder(_pv.get('o'));
</script></body></html>
