<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Automio OS · Galan — Producció i compres (demo)</title>
<link rel="icon" href="assets/logo-galan-mini.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#17233b;--mute:#667085;--line:#e4e8ef;--line2:#eef1f6;
--red:#c8102e;--redbg:#fde7ea;--redink:#a40d24;
--amb:#b54708;--ambbg:#fef3e2;
--grn:#067647;--grnbg:#dcfae6;
--acc:#c8102e;--accbg:#fdeef0;--accink:#a40d24;
--navy:#16233f;--side:#121c30;--side2:#1b2740;--sidetxt:#c6cede;--sidemute:#7d8aa3;
--blu:#175cd3;--blubg:#eaf1fd;--pur:#6941c6;--purbg:#f2edfb;--gry:#475467;--grybg:#eef1f4}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font:13px/1.45 "Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--side);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin}
.brand{padding:14px 14px 12px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{display:flex;align-items:center;gap:9px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.brand .bn{font-weight:700;font-size:13.5px;color:#fff}
.brand .bs{font-size:9.5px;letter-spacing:.14em;color:var(--sidemute);font-weight:600;margin-top:2px;text-transform:uppercase}
.clientbox{margin:10px 14px;background:#fff;border-radius:10px;padding:9px 10px;display:flex;align-items:center;gap:9px}
.clientbox img{width:84px;height:auto;display:block}
.clientbox .cb-t{font-size:9.5px;letter-spacing:.1em;color:#98a2b3;font-weight:700;text-transform:uppercase;margin-bottom:3px}
nav{padding:8px 8px;flex:1}
nav .sec{font-size:9.5px;letter-spacing:.13em;color:#5d6b86;font-weight:700;padding:12px 10px 5px;text-transform:uppercase}
nav a{display:flex;align-items:center;gap:9px;color:var(--sidetxt);text-decoration:none;padding:7px 10px;border-radius:8px;cursor:pointer;font-weight:500;font-size:12.8px;margin-bottom:1px}
nav a svg{width:16px;height:16px;stroke:#8d9ab3;flex:none}
nav a:hover{background:var(--side2)}
nav a.on{background:rgba(200,16,46,.16);color:#fff;font-weight:600}
nav a.on svg{stroke:#ff6b7d}
nav a .n{margin-left:auto;background:var(--acc);color:#fff;border-radius:99px;font-size:10px;padding:0 6px;line-height:16px;font-weight:700}
nav a .n.warn{background:#e8890c}
.side-foot{font-size:10.5px;color:var(--sidemute);border-top:1px solid rgba(255,255,255,.07);padding:10px 14px;line-height:1.55}
main{min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:0 22px;position:sticky;top:0;z-index:15}
.topbar .crumb{font-weight:650;color:var(--navy);font-size:13.5px;white-space:nowrap}
.topbar .gsearch{flex:1;max-width:430px;position:relative}
.topbar .gsearch input{width:100%;border:1px solid var(--line);background:#f6f7f9;border-radius:8px;padding:7px 12px 7px 32px;font-size:12.5px;outline:none}
.topbar .gsearch input:focus{border-color:#e8a4ad;background:#fff}
.topbar .gsearch svg{position:absolute;left:10px;top:8px;width:15px;height:15px;stroke:#98a2b3}
.gsearch .sr{position:absolute;top:36px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(15,23,42,.14);z-index:40;display:none;overflow:hidden}
.gsearch .sr.on{display:block}
.gsearch .sr div{padding:8px 12px;font-size:12.5px;cursor:pointer;display:flex;gap:8px;align-items:center}
.gsearch .sr div:hover{background:#f6f8fc}
.topbar .sp{flex:1}
.pill{font-size:10px;font-weight:700;letter-spacing:.05em;background:var(--ambbg);color:var(--amb);border:1px solid #f1d19a;border-radius:99px;padding:4px 11px;white-space:nowrap}
.bell{position:relative;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff}
.bell svg{width:16px;height:16px;stroke:#475467}
.bell .bd{position:absolute;top:-4px;right:-4px;background:var(--acc);color:#fff;border-radius:99px;font-size:9.5px;font-weight:700;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.rolepick{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 7px;border-radius:9px;border:1px solid transparent}
.rolepick:hover{background:#f6f7f9;border-color:var(--line)}
.roleinfo{line-height:1.15;text-align:left}
.roleinfo b{font-size:12px;color:var(--navy);display:block;font-weight:650}
.roleinfo span{font-size:10.5px;color:var(--mute)}
.rolemenu{position:absolute;top:54px;right:16px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(16,24,40,.16);width:296px;padding:6px;display:none;z-index:60}
.rolemenu.on{display:block}
.rolemenu .rm-t{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);padding:7px 9px 3px}
.rolemenu .ri{display:flex;gap:10px;align-items:center;padding:8px 9px;border-radius:8px;cursor:pointer}
.rolemenu .ri:hover{background:#f6f7f9}
.rolemenu .ri.on{background:#fdf0f1}
.rolemenu .rm-f{font-size:10.5px;color:var(--mute);padding:7px 9px 5px;border-top:1px solid var(--line);margin-top:4px}
@media(max-width:980px){.roleinfo{display:none}.rolemenu{right:8px}}
.content{padding:20px 22px 70px}
h1{font-size:19px;margin:0;color:var(--navy);letter-spacing:-.01em}
.sub{color:var(--mute);margin:3px 0 16px;font-size:12.5px}
.row-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.row-head .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;transition:box-shadow .18s ease,transform .18s ease}
.card:hover{box-shadow:0 6px 18px rgba(15,23,42,.07)}
.chip,.btn{transition:all .15s ease}
.chip:hover{border-color:#aab4c6}
tr.row{transition:background .12s ease}
.panel{animation:slidein .22s ease}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.bulkbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:10px 16px;display:none;gap:14px;align-items:center;z-index:45;box-shadow:0 10px 30px rgba(13,20,36,.35);font-size:12.5px}
.bulkbar.on{display:flex}
.bulkbar .bb-n{font-weight:700}
.bulkbar button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.bulkbar button:hover{background:rgba(255,255,255,.16)}
.empty{padding:38px 20px;text-align:center;color:var(--mute)}
.empty .et{font-weight:650;color:var(--navy);margin-bottom:4px;font-size:13px}
.cbxsel{width:15px;height:15px;accent-color:var(--acc);cursor:pointer}
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut-legend{font-size:12px;display:grid;gap:7px;flex:1}
.donut-legend .dl{display:flex;align-items:center;gap:8px}
.donut-legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.donut-legend .dlb{margin-left:auto;font-weight:650}
.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:0 0 12px;font-weight:700}
.grid{display:grid;gap:14px;margin-bottom:14px}
.k5{grid-template-columns:repeat(5,1fr)}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:1fr 1fr}.two{grid-template-columns:1.65fr 1fr}.two-r{grid-template-columns:1fr 1.65fr}
.kpi b{font-size:23px;display:block;line-height:1.1;color:var(--navy);font-weight:750;letter-spacing:-.02em}
.kpi span{color:var(--mute);font-size:11.8px}
.kpi .d{font-size:11px;margin-top:4px}
.kpi.bad b{color:var(--red)}.kpi.warn b{color:var(--amb)}.kpi.ok b{color:var(--grn)}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:10.8px;font-weight:600;white-space:nowrap}
.t-red{background:var(--redbg);color:var(--redink)}.t-amb{background:var(--ambbg);color:var(--amb)}.t-grn{background:var(--grnbg);color:var(--grn)}.t-blu{background:var(--blubg);color:var(--blu)}.t-gry{background:var(--grybg);color:var(--gry)}.t-pur{background:var(--purbg);color:var(--pur)}.t-nvy{background:#e7ecf5;color:var(--navy)}
.mut{color:var(--mute)}.small{font-size:11.8px}.b{font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools .sp{flex:1}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12px;color:#34405a}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .c{opacity:.65;font-size:11px;margin-left:3px}
input,select,textarea{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:#e8a4ad}
input[type=search],input[type=text]{min-width:190px}
textarea{width:100%;min-height:150px;line-height:1.55}
button.btn{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.btn.ghost{background:#fff;color:var(--navy);border-color:#cbd2e0}
button.btn.soft{background:var(--accbg);color:var(--accink);border-color:transparent}
button.btn.danger{background:#fff;color:var(--redink);border-color:#f0c4c6}
button:disabled{opacity:.45;cursor:default}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10.3px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f8f9fb;font-weight:700;position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal}
tr.row{cursor:pointer}tr.row:hover td{background:#f7f9fc}
tr.sel td{background:var(--accbg)}
.tfoot{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:11.5px;color:var(--mute);background:#f8f9fb;border-top:1px solid var(--line)}
.bar{height:6px;background:#eceef2;border-radius:99px;overflow:hidden;min-width:64px}.bar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.bar.risk i{background:var(--red)}.bar.warn i{background:#e8890c}.bar.ok i{background:var(--grn)}
.drawer{position:fixed;inset:0;background:rgba(13,20,36,.45);display:none;z-index:30}
.drawer.on{display:block}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(760px,100%);background:#fff;padding:0;overflow-y:auto;box-shadow:-10px 0 34px rgba(13,20,36,.2)}
.panel .ph{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 22px 0;z-index:2}
.panel .pb{padding:16px 22px 44px}
.panel h2{font-size:17px;margin:0;color:var(--navy)}
.x{float:right;border:0;background:#eef0f3;border-radius:7px;width:30px;height:30px;font-size:16px;cursor:pointer;color:#475467}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
.tabs button{border:0;background:none;font:inherit;font-size:12.5px;padding:9px 12px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--acc);font-weight:650;border-bottom-color:var(--acc)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 18px;border-radius:9px;font-size:12.5px;z-index:60;display:none;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.why{background:var(--accbg);border-radius:9px;padding:10px 12px;margin:10px 0;font-size:12.5px;line-height:1.55;color:var(--accink)}
.note{background:#f8f9fb;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;color:#475467}
.banner{background:var(--ambbg);border:1px solid #f1d19a;border-radius:11px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;color:#7a4a00}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;margin:12px 0;font-size:12.5px}
.kv div:nth-child(odd){color:var(--mute)}
.tl{margin:8px 0 0;padding:0;list-style:none}
.tl li{padding:0 0 12px 18px;position:relative;font-size:12.5px;border-left:2px solid var(--line);margin-left:5px}
.tl li:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--navy)}
.tl li b{display:block;color:var(--navy)}
.tl .w{color:var(--mute);font-size:11.5px}
.docview{background:#f8f9fb;border:1px solid var(--line);border-radius:11px;padding:14px;font-size:12.5px}
.mailprev{background:#f7f8fa;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:12.5px;margin-top:10px}
.mailprev .mh{color:var(--mute);font-size:11.5px;margin-bottom:6px}
.qitem{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:10px;align-items:flex-start;cursor:pointer}
.qitem:hover{border-color:#c9d0e0;box-shadow:0 2px 8px rgba(15,23,42,.06)}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.d-red{background:var(--red)}.d-amb{background:#e8890c}.d-blu{background:var(--navy)}.d-gry{background:#a7b0bf}.d-grn{background:#1f9d55}
.qitem .b{flex:1;min-width:0}
.phase{display:flex;gap:0;align-items:stretch;margin:14px 0 6px;overflow-x:auto;padding-bottom:4px}
.pstep{flex:1;min-width:86px;text-align:center;position:relative;padding-top:20px;font-size:10.8px;color:var(--mute)}
.pstep:before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:var(--line)}
.pstep .st-dot{position:absolute;top:1px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.pstep.done .st-dot{background:var(--grn);border-color:var(--grn)}
.pstep.done:before{background:var(--grn)}
.pstep.cur .st-dot{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px var(--accbg)}
.pstep.cur{color:var(--accink);font-weight:650}
.pstep.blocked .st-dot{background:var(--red);border-color:var(--red)}
.pstep.blocked{color:var(--redink);font-weight:650}
.gantt{display:grid;gap:5px}
.grow{display:grid;grid-template-columns:150px 1fr 74px;gap:8px;align-items:center;font-size:11.8px}
.gtrack{height:16px;background:#f0f2f6;border-radius:5px;position:relative;overflow:hidden}
.gfill{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--navy)}
.gfill.risk{background:var(--red)}.gfill.warn{background:#e8890c}.gfill.ok{background:#3aa76d}
.cap{display:grid;gap:7px}
.caprow{display:grid;grid-template-columns:128px 1fr 46px;gap:8px;align-items:center;font-size:11.8px}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px}
.spark i{flex:1;background:#dfe3ec;border-radius:3px 3px 0 0;min-height:3px}
.spark i.hi{background:var(--acc)}
.hbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11.8px}
.hbar .lb{width:150px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;height:14px;background:#f0f2f6;border-radius:5px;overflow:hidden;display:block}
.hbar .fl{display:block}
.hbar .fl{height:100%;border-radius:5px;background:var(--navy)}
.hbar .vl{width:76px;text-align:right;font-weight:600;white-space:nowrap}
.chk{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.chk .cbx{width:16px;height:16px;border-radius:5px;border:1.5px solid #c6ccd8;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800}
.chk.done .cbx{background:var(--grn);border-color:var(--grn)}
.chk.done .ct{text-decoration:line-through;color:var(--mute)}
.chk.fail .cbx{background:var(--red);border-color:var(--red)}
.sup-h{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.sup-av{width:42px;height:42px;border-radius:10px;background:var(--accbg);color:var(--accink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.lot{display:inline-block;background:#f1f4f9;border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:11px;font-weight:600;color:var(--navy);margin:1px 2px 1px 0}
.mnav{display:none}
.mlogo{display:none;width:64px;height:auto;flex:none}
@media(max-width:980px){
.mlogo{display:block}
.app{grid-template-columns:1fr}
aside{display:none}
.k5,.k4{grid-template-columns:repeat(2,1fr)}
.k3{grid-template-columns:1fr}
.k2,.two,.two-r{grid-template-columns:1fr}
.content{padding:14px 12px 92px}
.topbar{padding:0 12px}
.topbar .crumb{display:none}
.panel{width:100%}
.mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--side);z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
.mnav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sidemute);font-size:9.8px;font-weight:600;text-decoration:none;padding:4px 8px;border-radius:8px;position:relative}
.mnav a svg{width:19px;height:19px;stroke:var(--sidemute)}
.mnav a.on{color:#fff}
@media(max-width:560px){.pill{display:none}}.mnav a.on svg{stroke:#ff6b7d}
.mnav a .n{position:absolute;top:0;right:4px;background:var(--acc);color:#fff;border-radius:99px;font-size:9px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
.grow{grid-template-columns:96px 1fr 56px}
.caprow{grid-template-columns:88px 1fr 40px}
.hbar .lb{width:96px}
}
</style></head><body>
<div class="app">
<aside>
<div class="brand"><div class="logo"><div class="mark">A</div><div><div class="bn">Automio OS</div><div class="bs">Producció · Compres</div></div></div>
<div class="clientbox"><div><div class="cb-t">Preparada per a</div><img src="assets/logo-galan.webp" alt="Galan — Twisting and winding machines"></div></div>
</div>
<nav id="nav"></nav>
<div class="side-foot">Demo funcional amb dades fictícies.<br>Cap acció no s'aplica sola: tot passa per aprovació.<br><span class="mut">Fonts públiques: galan.es</span></div>
</aside>
<main>
<div class="topbar">
<img class="mlogo" src="assets/logo-galan.webp" alt="Galan">
<div class="crumb" id="crumb">Tauler</div>
<div class="gsearch"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="gs" type="search" placeholder="Cerca OF, comanda, article, proveïdor…" autocomplete="off"><div class="sr" id="gsr"></div></div>

const pcTag=e=>({retard:'<span class="tag t-red">Retard</span>',parcial:'<span class="tag t-amb">Recepció parcial</span>',rebuda:'<span class="tag t-grn">Rebuda</span>','en-curs':'<span class="tag t-nvy">En curs</span>','pendent-conf':'<span class="tag t-amb">Pendent confirmació</span>','pendent-ap':'<span class="tag t-red">Pendent aprovar</span>'}[e]||e);
const faseSt=s=>({done:'Feta',cur:'En curs',next:'Següent',wait:'Pendent',blocked:'Bloquejada'}[s]);
function bar(v,mx,cls){const p=Math.min(100,Math.round(v/mx*100));return `<div class="bar ${cls||''}"><i style="width:${p}%"></i></div>`}
function donutSVG(items){const R=46,C=2*Math.PI*R;let acc=0;const total=items.reduce((a,b)=>a+b.v,0);
 const segs=items.map(i=>{const frac=i.v/total;const s=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${i.c}" stroke-width="17" stroke-dasharray="${frac*C} ${C}" stroke-dashoffset="${-acc*C}" transform="rotate(-90 60 60)"/>`;acc+=frac;return s}).join('');
 return `<svg width="120" height="120" viewBox="0 0 120 120">${segs}<text x="60" y="57" text-anchor="middle" font-size="21" font-weight="750" fill="var(--navy)">${total}</text><text x="60" y="73" text-anchor="middle" font-size="9" fill="var(--mute)">OF</text></svg>`}
function areaSVG(vals,w,h){const mx=Math.max(...vals),mn=Math.min(...vals)-4;const X=i=>i/(vals.length-1)*w,Y=v=>h-(v-mn)/(mx-mn)*h;
 const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
 return `<svg width="100%" viewBox="0 0 ${w} ${h+22}" preserveAspectRatio="none"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8102e" stop-opacity=".22"/><stop offset="1" stop-color="#c8102e" stop-opacity="0"/></linearGradient></defs><polygon points="0,${h} ${pts} ${w},${h}" fill="url(#ag)"/><polyline points="${pts}" fill="none" stroke="#c8102e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${vals.map((v,i)=>i%2?`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="#fff" stroke="#c8102e" stroke-width="1.8"/>`:'').join('')}<text x="2" y="${h+16}" font-size="9" fill="var(--mute)">gen</text><text x="${w-16}" y="${h+16}" font-size="9" fill="var(--mute)">des</text></svg>`}
function spark(a){const mx=Math.max(...a);return `<div class="spark">${a.map(v=>`<i style="height:${Math.round(v/mx*100)}%" class="${v===mx?'hi':''}"></i>`).join('')}</div>`}

function selRow(){document.querySelectorAll('input.cbxsel[data-id]').forEach(c=>{c.checked?SEL.add(c.dataset.id):SEL.delete(c.dataset.id)});

 const er=document.querySelector(tableSel+' .emptyrow');if(er)er.style.display=vis?'none':''}

function openDrawer(head,tabs,body,tabFns){$('#d-head').innerHTML=head;$('#d-tabs').innerHTML=tabs;$('#d-body').innerHTML=body;$('#drawer').classList.add('on');window._tabFns=tabFns||{}}
function closeDrawer(){$('#drawer').classList.remove('on')}
function dtab(i,fn){document.querySelectorAll('#d-tabs button').forEach((b,j)=>b.classList.toggle('on',i===j));$('#d-body').innerHTML=window._tabFns[fn]()}
$('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer()});

function phaseBar(ruta){return `<div class="phase">${ruta.map(r=>`<div class="pstep ${r.st==='done'?'done':r.st==='cur'?'cur':r.st==='blocked'?'blocked':''}"><div class="st-dot"></div>${r.n.split('·')[0].trim()}<div class="small" style="font-size:9.5px">${r.st==='done'?'✓':r.st==='cur'?'en curs':''}</div></div>`).join('')}</div>`}

 const tabs=`<button class="on" onclick="dtab(0,'res')">Resum</button><button onclick="dtab(1,'bom')">Llista de materials</button><button onclick="dtab(2,'ruta')">Ruta i fases</button><button onclick="dtab(3,'trac')">Traçabilitat</button>`;
 const fns={
 res:()=>`<div class="kv"><div>Client</div><div>${o.cli}</div><div>Màquina</div><div><b>${o.maq}</b> — ${o.desc}</div><div>Aplicació</div><div>${o.aplic}</div><div>Fase actual</div><div>${o.fase}/10 · ${o.resp}</div><div>Hores</div><div>${o.horesR} imputades de ${o.horesP} planificades ${o.horesR>o.horesP?`<span class="tag t-red">+${o.horesR-o.horesP} h</span>`:''}</div><div>Lliurament</div><div><b>${o.lliur}</b></div><div>Risc material</div><div>${riscTag(o.risc)} ${o.riscTxt}</div></div>
  ${phaseBar(o.ruta)}
  <div class="why"><b>Connexió compres ↔ producció:</b> ${o.bom.filter(b=>b.est!=='ok').length?`hi ha ${o.bom.filter(b=>b.est!=='ok').length} línia(es) de material amb atenció. La data de cada compra es creua amb la fase que la necessita; si es mou, l'OF ho marca i es proposa replanificar (mai automàticament).`:'tot el material crític rebut o traçat. Sense bloquejos.'}</div>`,
 bom:()=>`<div class="tw" style="border:0"><table><tr><th>Material</th><th>Tipus</th><th>Req.</th><th>Estoc</th><th>Rebut</th><th>Comanda</th><th>Arribada</th><th>Estat</th></tr>
  ${o.bom.map(b=>`<tr><td class="wrap b">${b.art}</td><td class="small">${b.tip}</td><td>${b.req}</td><td>${b.stock}</td><td>${b.rebut}</td><td class="small">${b.pc!=='—'?`<a style="color:var(--blu);cursor:pointer" onclick="event.stopPropagation();openPC('${b.pc}')">${b.pc}</a>`:'—'}</td><td class="small">${b.eta}</td><td>${estTag(b.est)}</td></tr>`).join('')}

  ${o.ruta.map(r=>`<tr><td class="wrap b">${r.n}</td><td>${r.c}</td><td class="small">${r.hr}/${r.hp} h ${r.hr>r.hp?`<span class="tag t-red">+${r.hr-r.hp} h</span>`:''}</td><td class="small">${r.op}</td><td>${r.st==='done'?'<span class="tag t-grn">Feta</span>':r.st==='cur'?'<span class="tag t-blu">En curs</span>':r.st==='next'?'<span class="tag t-amb">Següent</span>':'<span class="tag t-gry">Pendent</span>'}</td><td class="wrap small mut">${r.nota||'—'}</td></tr>`).join('')}

function openAP(id){const a=AP(id);if(!a){toast('Decisió ja gestionada');return}

 const head=`<h2>${a.id} · ${a.t}</h2><div class="small mut" style="margin-top:3px">Decideix: <b>${a.who}</b> · <span class="tag ${a.sev==='red'?'t-red':a.sev==='amb'?'t-amb':'t-gry'}">${a.sev==='red'?'Crítica':a.sev==='amb'?'Aquesta setmana':'Planificable'}</span> <span class="tag t-nvy">${tipName[a.tip]}</span></div>`;
 const body=`<div class="kv"><div>Context</div><div>${a.ctx}</div><div>Impacte</div><div>${a.impact}</div><div>Qui decideix</div><div><b>${a.who}</b> (${tipName[a.tip]})</div></div>
 ${a.mail?`<h3 style="margin:16px 0 6px">Correu preparat (no s'envia sense el teu OK)</h3><div class="mailprev"><div class="mh">Per a: ${a.mail.to}<br>Assumpte: ${a.mail.sub}</div>${esc(a.mail.body).replace(/\n/g,'<br>')}</div>`:''}
 <div class="act"><button class="btn" onclick="resolveAP('${a.id}',true)">Aprovar${a.mail?' i enviar':''}</button><button class="btn ghost" onclick="resolveAP('${a.id}',false)">Rebutjar</button><button class="btn soft" onclick="closeDrawer()">Decidir més tard</button></div>
 <div class="note" style="margin-top:12px">Automio detecta i prepara; la decisió és sempre vostra. Tot queda registrat a Activitat.</div>`;
 openDrawer(head,'',body,{});
}

function resolveAP(id,ok){const a=AP(id);const i=D.approvals.indexOf(a);if(i<0){closeDrawer();return}
 D.approvals.splice(i,1);
 D.activity.unshift({d:'ara mateix',t:`${ok?'Aprovada':'Rebutjada'} ${a.id}: ${a.t}`,by:a.who.split('(')[0].trim()});
 const nav=D.nav.find(n=>n.id==='aprovacions');if(nav&&nav.n>0)nav.n--;
 $('#bell-n').textContent=Math.max(0,parseInt($('#bell-n').textContent)-1);
 renderNav();markNav();closeDrawer();
 toast(ok?`${a.id} aprovada — registrada a Activitat`:`${a.id} rebutjada — registrada a Activitat`);
 if(currentView()==='aprovacions')render();
 if(currentView()==='tauler')render();
}

 D.pcs.forEach(p=>{if((p.id+p.prov+p.items).toLowerCase().includes(q))res.push({t:`${p.id} · ${p.items}`,s:p.prov,fn:`openPC('${p.id}')`})});
 D.suppliers.forEach(s=>{if(s.nom.toLowerCase().includes(q))res.push({t:s.nom,s:s.cat,fn:`openSUP('${s.id}')`})});
 D.stock.forEach(s=>{if((s.ref+s.nom).toLowerCase().includes(q))res.push({t:`${s.ref} · ${s.nom}`,s:`Estoc ${s.st} · ${s.ub}`,fn:`go('estoc')`})});
 gsr.innerHTML=res.slice(0,8).map(r=>`<div onclick="${r.fn};gsr.classList.remove('on');gs.value=''"><span class="b">${r.t}</span><span class="mut small">${r.s}</span></div>`).join('')||'<div class="mut">Sense resultats</div>';
 gsr.classList.add('on')});
document.addEventListener('click',e=>{if(!e.target.closest('.gsearch'))gsr.classList.remove('on');if(!e.target.closest('.rolepick')&&!e.target.closest('.rolemenu'))$('#rolemenu').classList.remove('on')});

/* ---------- ROUTER ---------- */
const VIEWS={tauler:vTauler,aprovacions:vAprovacions,produccio:vProduccio,capacitat:vCapacitat,taller:vTaller,qualitat:vQualitat,compres:vCompres,solicituds:vSolicituds,estoc:vEstoc,proveidors:vProveidors,informes:vInformes,activitat:vActivitat};
function markNav(){const v=currentView();document.querySelectorAll('nav a,.mnav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v))}
function render(){const v=currentView();$('#crumb').textContent=TITLES[v]||'Tauler';$('#view').innerHTML=(VIEWS[v]||vTauler)();markNav();window.scrollTo(0,0);
 const p=location.hash.replace('#/','').split('/');
 if(p[1]==='of'&&OF(p[2]))openOF(p[2]);
 if(p[1]==='pc'&&PC(p[2]))openPC(p[2]);
 if(p[1]==='ap'&&AP(p[2]))openAP(p[2]);
 if(p[1]==='sup'&&SUP(p[2]))openSUP(p[2]);}
window.addEventListener('hashchange',()=>{closeDrawer();render()});
renderRoleUI();renderNav();render();
</script>
</body></html>
