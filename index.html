<style>:root{--bg:#eef0f4;--card:#fff;--ink:#1c2b43;--mute:#667085;--line:#e3e7ee;--side:#fff;--red:#d92d20;--redbg:#fee4e2;--amb:#b54708;--ambbg:#fff3df;--grn:#067647;--grnbg:#dcfae6;--acc:#0f7a3d;--accbg:#e6f4ea;--accink:#0b5f2f;--navy:#17335e}

main{min-width:0;display:flex;flex-direction:column}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}

textarea{width:100%;min-height:150px;line-height:1.55}
button.btn{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}

.src{font-size:10.5px;color:#98a2b3}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.chart .col .v{font-size:11px;font-weight:700;color:var(--navy)}
.chart .col .b{width:100%;max-width:38px;background:var(--accbg2,var(--accbg));border-radius:5px 5px 0 0;background:var(--navy);opacity:.85}
.chart .col .l{font-size:10.5px;color:var(--mute)}
.progress-steps{display:flex;gap:0;margin:14px 0}
.progress-steps .st{flex:1;text-align:center;font-size:11px;color:var(--mute);position:relative;padding-top:16px}
.progress-steps .st:before{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #d0d5dd}
.progress-steps .st:after{content:"";position:absolute;top:9px;left:calc(-50% + 8px);right:calc(50% + 8px);height:2px;background:#e4e7ec}
.progress-steps .st:first-child:after{display:none}
.progress-steps .st.done{color:var(--grn);font-weight:600}
.progress-steps .st.done:before{background:var(--grn);border-color:var(--grn)}
.progress-steps .st.done:after{background:var(--grn)}
.progress-steps .st.now{color:var(--acc);font-weight:700}
.progress-steps .st.now:before{border-color:var(--acc);background:var(--acc)}
.ofboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ofcard{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px}
.ofcard h4{margin:0 0 2px;font-size:13.5px;color:var(--navy)}
.matrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #eef0f4;font-size:12px}
.matrow:last-child{border:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{position:fixed;z-index:50;left:-240px;transition:left .2s}aside.open{left:0}.k4{grid-template-columns:repeat(2,1fr)}.two,.k2,.split{grid-template-columns:1fr}.content{padding:14px}}

  return `<div class="qitem" data-id="${a.id}"><span class="dot ${dot}"></span><div class="b"><div class="t">${esc(a.titulo)}</div><div class="m">${esc(a.detalle)}</div></div><span class="tag t-gry">${esc(a.qui)}</span></div>`;

CFG.views.inbox = c => {
  const pend = S.approvals.filter(a=>a.estado==='pendiente');
  const done = S.approvals.filter(a=>a.estado!=='pendiente');
  c.innerHTML = `<div class="row-head"><div><h1>Aprovacions</h1><div class="sub">Algunes decisions són de compres, d'altres de producció, i algunes de totes dues. El sistema proposa; la persona decideix.</div></div></div>
  <h2 style="margin:6px 0 12px">Pendents (${pend.length})</h2>
  ${pend.length?pend.map(qitemHTML).join(''):'<div class="note">Sense decisions pendents.</div>'}
  ${done.length?`<h2 style="margin:22px 0 12px">Resoltes (${done.length})</h2>`+done.map(a=>`<div class="qitem" data-id="${a.id}"><span class="dot d-grn"></span><div class="b"><div class="t">${esc(a.titulo)}</div><div class="m">${esc(a.estado)} · ${esc(a.resolucion||'')}</div></div></div>`).join(''):''}`;
  c.querySelectorAll('.qitem').forEach(q=>q.addEventListener('click',()=>openApproval(q.dataset.id)));
};

function openApproval(id){
  const a = S.approvals.find(x=>x.id===id); if(!a) return;
  const body = a.estado==='pendiente' ? `
    <div class="why"><b>Per què importa:</b> ${esc(a.why)}</div>
    ${a.accion.kind==='mail'?`<h3>Correu proposat (editable)</h3><textarea id="ap-mail">${a.accion.body}</textarea>`:''}
    ${a.accion.kind==='replan'?`<div class="note">Acció proposada: ${esc(a.accion.delta)}. Producció rep la nova data i comercial avisa el client. Tot queda registrat a l'OF.</div>`:''}
    ${a.accion.kind==='substitucio'?`<div class="note">Acció proposada: validar ${esc(a.accion.material)} per a ${esc(a.accion.of)}. Comprés confirma preu i data; producció confirma muntatge i rendiment.</div>`:''}
    <div class="act">
      ${a.accion.kind==='mail'?`<button class="btn" onclick="resolveApproval('${id}','mail')">Aprovar i enviar (simulat)</button>`:''}
      ${a.accion.kind==='replan'?`<button class="btn" onclick="resolveApproval('${id}','replan')">Aprovar replanificació (simulat)</button>`:''}
      ${a.accion.kind==='substitucio'?`<button class="btn" onclick="resolveApproval('${id}','substitucio')">Validar substitució (simulat)</button>`:''}
      <button class="btn ghost" onclick="toast('Esborrany desat (simulat)')">Desar esborrany</button>
      <button class="btn danger" onclick="resolveApproval('${id}','rebutjada')">Rebutjar</button>
    </div>`
  : `<div class="note">Resolta: ${esc(a.estado)} · ${esc(a.resolucion||'')}</div>`;
  openDrawer(`<div class="ph"><button class="x" onclick="closeDrawer()">×</button><h2>${esc(a.titulo)}</h2><div class="sub">${a.id} · ${esc(a.tipo)} · decideix: ${esc(a.qui)}</div></div><div class="pb"><p>${esc(a.detalle)}</p>${body}</div>`);
}
function resolveApproval(id, how){
  const a = S.approvals.find(x=>x.id===id); if(!a) return;
  if(how==='mail'){ a.estado='aprovada'; a.resolucion='correu registrat com a enviat (simulat)'; logAct(`Aprovat: ${a.titulo}`); }
  else if(how==='replan'){
    a.estado='aprovada'; a.resolucion='replanificació aplicada (simulat)';
    const o=S.ofs.find(x=>x.id===a.accion.proyecto); if(o){ o.muntatge='09/12'; o.prova='22/12'; o.risc='mitja'; }
    logAct(`Replanificació aprovada: ${a.accion.proyecto} (simulat).`);
  }
  else if(how==='substitucio'){
    a.estado='aprovada'; a.resolucion='equivalent validat (simulat)';
    const o=S.ofs.find(x=>x.id===a.accion.of); if(o){ const m=o.materials.find(m=>m.desc.includes('6312')); if(m){m.desc='Rodaments 6312-2RS (8 uds)'; m.estat='en-curs';} o.risc='baix'; }
    const pc=S.orders.find(x=>x.id==='PC-3116'); if(pc){ pc.lineas[0].desc='Rodament 6312-2RS'; pc.lineas[0].estado='confirmat'; pc.estado='confirmat'; pc.entrega='previst 02/12'; }
    logAct(`Substitució validada: ${a.accion.material} (simulat).`);
  }
  else { a.estado='rebutjada'; a.resolucion='rebutjada per l\'usuari'; logAct(`Rebutjada: ${a.titulo}`); }
  save(); closeDrawer(); renderView(); toast(how==='rebutjada'?'Decisió rebutjada':'Aprovat i registrat (simulat)');
}

function openOrder(o){ drawerState = {tab:'lin', render:()=>renderOrderDrawer(o.id)}; renderOrderDrawer(o.id); }
function renderOrderDrawer(oid){
  const o = S.orders.find(x=>x.id===oid);
  const tabs = [{id:'lin',l:'Línies'},{id:'seg',l:'Seguiment'},{id:'doc',l:'Documents'}];
  let body='';
  if(drawerState.tab==='lin'){
    body = tableHTML([
      {k:'d',l:'Descripció',f:l=>esc(l.desc),wrap:true},
      {k:'q',l:'Ud.',f:l=>l.qty,num:true},
      {k:'p',l:'Preu ud.',f:l=>fmtE(l.precio),num:true},
      {k:'e',l:'Estat',f:l=>tag(EST_L,l.estado)}
    ], o.lineas, {foot:`Total: ${fmtE(o.total)}`});
  } else if(drawerState.tab==='seg'){
    body = `<ul class="tl">
      <li><b>Comanda emesa</b><span class="w">fa 10 dies · compres</span></li>
      ${o.estado!=='borrador'?'<li><b>Enviada al proveïdor</b><span class="w">fa 9 dies</span></li>':''}
      ${['confirmat','parcial','rebut'].includes(o.estado)?'<li><b>Confirmada pel proveïdor</b><span class="w">fa 7 dies</span></li>':''}
      ${o.estado==='endarrerit'?'<li><b>Avís de retard</b><span class="w">fa 2 dies · nova data comunicada</span></li>':''}
      ${o.estado==='rebut'?'<li><b>Recepció registrada</b><span class="w">material a magatzem</span></li>':''}
      ${o.estado==='esgotat'?'<li><b>Sense estoc al proveïdor</b><span class="w">proposada equivalència</span></li>':''}
    </ul><div class="note">Historial d'exemple. En producció s'alimenta dels correus i recepcions reals.</div>`;
  } else {
    body = `<div class="docview">📄 Comanda ${o.id}.pdf (exemple)<br><span class="mut">Albarà — pendent</span></div>
    <div class="act"><button class="btn ghost" onclick="toast('Document adjuntat (simulat)')">Adjuntar document (simulat)</button></div>`;
  }
  const acciones = [];
  if(o.estado!=='rebut'){
    acciones.push(`<button class="btn" onclick="mailSeguimiento('${o.id}')">Preparar seguiment</button>`);
    if(o.lineas.some(l=>l.estado!=='rebut')) acciones.push(`<button class="btn soft" onclick="recepcioParcial('${o.id}')">Registrar recepció</button>`);
  }
  document.querySelector('#drawer .panel').innerHTML = `<div class="ph"><button class="x" onclick="closeDrawer()">×</button><h2>${o.id} · ${esc(o.prov)}</h2><div class="sub">${o.of!=='—'?'OF '+o.of+' · ':''}lliurament: ${esc(o.entrega)} · ${tag(EST_O,o.estado)}</div>${drawerTabs(tabs, drawerState.tab)}</div><div class="pb">${body}<div class="act">${acciones.join('')}</div></div>`;
}
function mailSeguimiento(oid){
  const o = S.orders.find(x=>x.id===oid);
  openDrawer(`<div class="ph"><button class="x" onclick="closeDrawer()">×</button><h2>Seguiment de ${o.id}</h2><div class="sub">El correu el revises abans que surti (simulat)</div></div>
  <div class="pb"><textarea id="sg-mail">Bon dia,\n\nescrivim sobre la comanda ${o.id} (${o.lineas.map(l=>l.desc).join('; ')}). Estat actual: ${EST_O[o.estado][1].toLowerCase()}. Necessitem confirmació de data i qualsevol incidència que pugui afectar ${o.of!=='—'?'l\''+o.of:'la planificació'}.\n\nGràcies.</textarea>
  <div class="act"><button class="btn" onclick="enviarSeguiment('${o.id}')">Aprovar i enviar (simulat)</button><button class="btn ghost" onclick="openOrder(S.orders.find(x=>x.id==='${o.id}'))">Tornar</button></div></div>`);
}
function enviarSeguiment(oid){ logAct(`Seguiment de ${oid} aprovat i registrat com a enviat (simulat).`); save(); closeDrawer(); renderView(); toast('Correu registrat com a enviat (simulat)'); }
function recepcioParcial(oid){
  const o = S.orders.find(x=>x.id===oid);
  const pend = o.lineas.filter(l=>l.estado!=='rebut');
  if(!pend.length) return;
  const l = pend[0]; l.estado='rebut';
  o.estado = o.lineas.every(x=>x.estado==='rebut') ? 'rebut' : 'parcial';
  const of = S.ofs.find(x=>x.id===o.of); if(of){ const m=of.materials.find(m=>m.compra===oid); if(m) m.estat='rebut'; }
  logAct(`Recepció registrada a ${oid}: ${l.desc} (simulat).`);
  save(); renderOrderDrawer(oid); renderShell(); toast('Recepció registrada (simulat)');
}
function novaComanda(){
  const n = 'PC-' + (3119 + S.orders.filter(o=>o.id.startsWith('PC-')).length);
  S.orders.unshift({id:n, prov:'(sense assignar)', of:'—', estado:'borrador', total:0, entrega:'—', lineas:[{desc:'Línia nova (editar)', qty:1, precio:0, estado:'pendent'}]});

const LSKEY = 'automio-demo-' + CFG.slug;
let S = loadState();
function loadState(){
  try{ const raw = localStorage.getItem(LSKEY); if(raw){ const p = JSON.parse(raw); if(p && p.v === CFG.v) return p.s; } }catch(e){}
  return JSON.parse(JSON.stringify(CFG.initial));
}
function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify({v:CFG.v, s:S})); }catch(e){} }
function resetDemo(){ localStorage.removeItem(LSKEY); location.reload(); }

  search:'M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.35-4.35'
};
function icon(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[name]||ICONS.panel}"/></svg>`; }

function renderShell(){
  const mods = CFG.modules.map(m => {
    if(m.sec) return `<div class="sec">${esc(m.sec)}</div>`;
    const badge = m.badge ? `<span class="n">${typeof m.badge==='function'?m.badge(S):m.badge}</span>` : '';
    return `<a data-v="${m.id}" class="${VIEW===m.id?'on':''}" onclick="go('${m.id}')">${icon(m.icon)}<span>${esc(m.label)}</span>${badge}</a>`;
  }).join('');
  document.getElementById('app').innerHTML = `
  <aside id="side">
    <div class="brand"><div class="logo"><div class="mark">${esc(CFG.mark)}</div><div><div class="bn">${esc(CFG.company)}</div><div class="bs">AUTOMIO OS · DEMO</div></div></div></div>
    <nav>${mods}</nav>
    <div class="side-foot">${CFG.t.foot}</div>
  </aside>
  <main>
    <div class="topbar">
      <div class="crumb">${esc(CFG.company)} · ${esc((CFG.modules.find(m=>m.id===VIEW)||{}).label||'')}</div>
      <div class="sp"></div>
      <span class="pill">${CFG.t.pill}</span>
      <div class="avatar">${esc(CFG.userIni)}</div>
    </div>
    <div class="content" id="content"></div>
  </main>
  <div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()"></div>
  <div class="toast" id="toast"></div>`;
  renderView();
}
function go(v){ VIEW=v; location.hash=v; renderShell(); window.scrollTo(0,0); }
window.addEventListener('hashchange',()=>{ const v=location.hash.slice(1); if(v&&v!==VIEW){VIEW=v;renderShell();} });

function renderView(){
  const m = CFG.modules.find(x=>x.id===VIEW) || CFG.modules.find(x=>x.id===CFG.home);
  const c = document.getElementById('content'); if(!c) return;
  c.innerHTML = '';
  (CFG.views[m.id]||CFG.views[CFG.home])(c);
  document.querySelector('.topbar .crumb').innerHTML = `${esc(CFG.company)} · ${esc(m.label)}`;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on', a.dataset.v===m.id));
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2800); }

function openDrawer(html){ const d=$('#drawer'); d.innerHTML=`<div class="panel">${html}</div>`; d.classList.add('on'); }
function closeDrawer(){ $('#drawer').classList.remove('on'); drawerState=null; }

function logAct(text){ S.activity.unshift({ts:new Date().toISOString(), text}); if(S.activity.length>200)S.activity.length=200; save(); }

function chipRow(groups, active, onpick){
  // groups: [{key,label,count}]
  return `<div class="tools">${groups.map(g=>`<button class="chip ${active===g.key?'on':''}" onclick="${onpick}('${g.key}')">${esc(g.label)}${g.count!=null?` <span class="c">${g.count}</span>`:''}</button>`).join('')}</div>`;
}

function tableHTML(cols, rows, opts={}){
  const rowFn = opts.rowFn || (()=> '');
  const head = cols.map(c=>`<th style="${c.w?`width:${c.w}`:''}">${esc(c.l)}</th>`).join('');
  const body = rows.length ? rows.map((r,i)=>`<tr class="row" data-i="${i}" ${rowFn(r,i)}>${cols.map(c=>`<td class="${c.wrap?'wrap':''}" style="${c.num?'text-align:right':''}">${c.f(r)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="mut" style="text-align:center;padding:26px">${esc(opts.empty||CFG.t.empty)}</td></tr>`;
  const foot = opts.foot || `${rows.length} ${CFG.t.records}`;
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table><div class="tfoot">${foot}</div></div>`;
}

function attachRowClicks(root, rows, onclick){
  root.querySelectorAll('tr.row').forEach(tr=>tr.addEventListener('click',ev=>{
    if(ev.target.closest('button')||ev.target.closest('input')||ev.target.closest('select')||ev.target.closest('a')) return;
    onclick(rows[+tr.dataset.i]);
  }));
}

function steps(items, cur){
  return `<div class="progress-steps">${items.map((s,i)=>`<div class="st ${i<cur?'done':i===cur?'now':''}">${esc(s)}</div>`).join('')}</div>`;
}

function kv(pairs){ return `<div class="kv">${pairs.map(([k,v])=>`<div>${esc(k)}</div><div>${v}</div>`).join('')}</div>`; }

function mailPreview(m){
  return `<div class="mailprev"><div class="mh">${esc(CFG.t.mailto)}: ${esc(m.to)} · ${esc(CFG.t.mailsubj)}: ${esc(m.subj)}</div>${m.body}</div>`;
}

function drawerTabs(tabs, active){
  return `<div class="tabs">${tabs.map(t=>`<button class="${t.id===active?'on':''}" onclick="drawerState.tab='${t.id}';renderDrawerBody()">${esc(t.l)}</button>`).join('')}</div>`;
}
function renderDrawerBody(){ if(drawerState&&drawerState.render) drawerState.render(); }

document.addEventListener('DOMContentLoaded', renderShell);

</script></body></html>
