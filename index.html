const $=s=>document.querySelector(s);
const LS=C.key+'-v3';
let state={route:'avui',tab:'prov',q:'',chip:'all'};
let D; // decisions
try{D=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){D={}}
function saveD(){try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
function go(r,x){state.route=r;if(x&&x.tab)state.tab=x.tab;closeDr();render();window.scrollTo(0,0)}
function navHTML(a){const pend=C.aps.filter(x=>!D[x.id]).length;
 return a.map(([k,t])=>`<a class="${state.route===k?'on':''}" onclick="go('${k}')">${t}${k==='aprovacions'&&pend?`<span class="n">${pend}</span>`:''}</a>`).join('')}
function nav(){$('#side').innerHTML=`<div class="brand"><img src="${C.logo}" alt="${C.name}"><small>ASSISTENT DE COMPRES</small></div>${navHTML(C.nav)}<div class="side-foot">Res no s'envia ni s'actualitza sense aprovació.<br><br><b>Demo independent</b>, no és un producte oficial de ${C.name}. Dades fictícies.</div>`;
 $('#mob').innerHTML=navHTML(C.nav.filter(([k])=>k!=='mes').concat([['mes','Més']]));}
function sup(id){return C.sups[id]||{n:id,c:'',cat:''}}
function ord(id){return C.orders.find(o=>o.id===id)}
function recvPct(o){const q=o.L.reduce((a,l)=>a+l.q,0),r=o.L.reduce((a,l)=>a+l.r,0);return q?Math.round(r/q*100):0}
function ordState(o){const today=C.today,p=recvPct(o);if(p===100)return['Rebuda','t-grn'];const ref=o.cd||o.pd;if(ref<today)return['En retard','t-red'];if(o.cd&&o.cd>o.pd)return['Reprogramada','t-amb'];if(p>0)return['Parcial','t-amb'];if(!o.cd)return['Sense confirmar','t-gry'];return['Confirmada','t-blu']}
function fmtD(d){if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`}
function decided(id){return D[id]}
function kpi(label,val,cls){return `<div class="card kpi ${cls||''}"><b>${val}</b><span>${label}</span></div>`}

/* ---------- AVUI ---------- */
function vAvui(){const pend=C.aps.filter(a=>!D[a.id]);const open=C.orders.filter(o=>recvPct(o)<100).length;const part=C.orders.filter(o=>recvPct(o)>0&&recvPct(o)<100).length;
 let h=`<div class="heading"><h1>Bon dia, ${C.contact}</h1><div class="sub">${C.tagline} Res no s'envia ni es registra sense la teva aprovació.</div></div>`;
 h+=`<div class="grid ${C.of?'k4':'k3'}" style="margin-bottom:14px">${kpi('Aprovacions pendents',pend.length,pend.length?'warn':'')}${kpi('Comandes obertes',open)}${kpi('Recepcions parcials',part)}${C.of?kpi('Ordres de fabricació en risc',C.of.filter(o=>o.risk).length,C.of.some(o=>o.risk)?'bad':''):''}</div>`;
 if(C.alert)h+=`<div class="banner ${C.alert.cls||''}"><span class="dot ${C.alert.cls==='amber'?'d-amb':'d-red'}" style="margin-top:4px"></span><div><b>${esc(C.alert.t)}</b><br>${esc(C.alert.d)} <a href="#" onclick="go('${C.alert.go}');return false" style="color:var(--navy);font-weight:600">${esc(C.alert.link)}</a></div></div>`;
 h+=`<div class="grid two"><div class="card"><h2>Decisions pendents</h2>`;
 if(!pend.length)h+=`<div class="empty">Tot decidit. Quan entri un correu o canvii una data, la proposta apareixerà aquí.</div>`;
 pend.slice(0,3).forEach(a=>{h+=`<div class="item"><span class="dot ${a.side==='produccio'?'d-blu':a.urg?'d-red':'d-amb'}"></span><div class="b"><span class="tag ${TYPE_TAG[a.type]||'t-gry'}">${a.type}</span>${a.side?` <span class="tag t-blu">${a.side==='produccio'?'Producció':'Compres'}</span>`:''}<div style="margin-top:4px"><b>${esc(a.title)}</b></div><div class="small mut">${esc(a.brief)}</div></div><button class="btn ghost" onclick="go('aprovacions');setTimeout(()=>openAp('${a.id}'),60)">Revisar</button></div>`});
 h+=`</div><div class="card"><h2>Agenda de la setmana</h2>${C.agenda.map(a=>`<div class="item"><span class="dot d-gry"></span><div class="b"><b>${esc(a[0])}</b><div class="small mut">${esc(a[1])}</div></div><span class="small mut" style="white-space:nowrap">${esc(a[2])}</span></div>`).join('')}</div></div>`;
 $('#view').innerHTML=h}

/* ---------- APROVACIONS ---------- */
const TYPE_TAG={'Seguiment':'t-amb','Canvi de data':'t-red','Factura':'t-red','Recepció':'t-blu','Substitució':'t-amb','Documentació':'t-amb','Preu':'t-red','Comanda nova':'t-grn','Sincronització':'t-blu','Reclamació':'t-red'};
function vApprov(){const pend=C.aps.filter(a=>!D[a.id]);const done=C.aps.filter(a=>D[a.id]);
 let h=`<div class="heading"><h1>Aprovacions</h1><div class="sub">El sistema prepara i proposa; tu decideixes cas per cas. Aprovar registra la decisió a l'historial. En aquesta demo no s'envia res.</div></div>`;
 if(!pend.length)h+=`<div class="card empty">Cap proposta pendent. Totes les decisions estan preses.</div>`;
 pend.forEach(a=>{const o=ord(a.order);h+=`<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:230px"><span class="tag ${TYPE_TAG[a.type]||'t-gry'}">${a.type}</span>${a.side?` <span class="tag t-blu">${a.side==='produccio'?'Decideix producció':'Decideix compres'}</span>`:''}${a.urg?' <span class="tag t-red">Urgent</span>':''}<h3 style="margin:8px 0 4px;font-size:15px">${esc(a.title)}</h3><div class="small mut">${o?esc(o.id)+(o.proj?` · ${esc(o.proj)}`:'')+(a.of?` · ${a.of}`:''):''}</div><div class="why"><b>Per què ho proposa:</b> ${esc(a.why)}</div></div><button class="btn" onclick="openAp('${a.id}')">Revisar i decidir</button></div></div>`});
 if(done.length){h+=`<div class="card"><h2>Registre de decisions</h2>${done.map(a=>{const d=D[a.id];return `<div class="item"><span class="dot ${d.action==='aprovada'?'d-grn':'d-red'}"></span><div class="b"><b>${esc(a.title)}</b><div class="small"><span class="dec ${d.action==='aprovada'?'':'rej'}">${d.action==='aprovada'?'Aprovada':'Rebutjada'}</span> · ${d.ts}${d.note?` · ${esc(d.note)}`:''}</div></div><button class="btn ghost" onclick="undoAp('${a.id}')">Desfés</button></div>`}).join('')}</div>`}
 $('#view').innerHTML=h}
function openAp(id){const a=C.aps.find(x=>x.id===id);if(!a)return;const o=ord(a.order);const d=D[id];
 let h=`<button class="x" onclick="closeDr()">×</button><span class="tag ${TYPE_TAG[a.type]||'t-gry'}">${a.type}</span>${a.side?` <span class="tag t-blu">${a.side==='produccio'?'Decideix producció':'Decideix compres'}</span>`:''}<h2 style="margin:10px 0 4px">${esc(a.title)}</h2>`;
 if(o)h+=`<div class="kv"><div>Comanda</div><div><a href="#" onclick="closeDr();openOrder('${o.id}');return false" style="color:var(--navy)">${o.id}</a>${o.proj?` · ${esc(o.proj)}`:''}</div><div>Proveïdor</div><div>${esc(sup(o.s).n)}</div><div>Promesa</div><div>${fmtD(o.pd)}${o.cd?` → confirmada ${fmtD(o.cd)}`:' (sense confirmar)'}</div></div>`;
 h+=`<div class="why"><b>Per què ho proposa:</b> ${esc(a.why)}</div>`;
 if(a.opts){h+=`<h3>Opcions</h3>${a.opts.map((op,i)=>`<label style="display:block;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer"><input type="radio" name="opt" value="${i}" ${i===0?'checked':''} style="margin-right:8px"><b>${esc(op.t)}</b><br><span class="small mut" style="margin-left:24px">${esc(op.d)}</span></label>`).join('')}`}
 if(a.draft)h+=`<h3 style="margin-top:18px">Esborrany preparat (editable)</h3><div class="mailprev"><div class="mh">Per a: ${esc(a.draft.to)}<br>Assumpte: ${esc(a.draft.subj)}</div><textarea id="draftbody">${esc(a.draft.body)}</textarea></div>`;
 if(d){h+=`<div class="act"><span class="dec ${d.action==='aprovada'?'':'rej'}">${d.action==='aprovada'?'Aprovada':'Rebutjada'} · ${d.ts}${d.note?' · '+esc(d.note):''}</span><button class="btn ghost" onclick="undoAp('${a.id}')">Desfés</button></div>`}
 else{h+=`<div class="act"><button class="btn" onclick="decideAp('${a.id}','aprovada')">Aprova${a.draft?' i marca per enviar':''}</button>${a.draft?`<button class="btn soft" onclick="decideAp('${a.id}','aprovada',true)">Aprova amb l'edició</button>`:''}<button class="btn ghost" onclick="rejectAsk('${a.id}')">Rebutja</button></div><div class="small mut" style="margin-top:8px">Simulació: aprovar no envia correus ni escriu a cap ERP; només registra la decisió.</div>`}
 $('#pn').innerHTML=h;$('#dr').classList.add('on')}

 h+=`<div class="kv"><div>Emesa</div><div>${fmtD(o.od)}</div><div>Promesa</div><div>${fmtD(o.pd)}</div><div>Confirmada</div><div>${o.cd?fmtD(o.cd):'No confirmada'}</div>${o.of?`<div>Ordre de fabricació</div><div>${esc(o.of)}</div>`:''}${o.imp?`<div>Impacte</div><div>${esc(o.imp)}</div>`:''}</div>`;

 h+=`<h3 style="margin-top:18px">Historial</h3><ul class="tl">${o.ev.map(e=>`<li><span class="mut small">${fmtD(e[0])} · ${esc(e[1])}</span><br>${esc(e[2])}</li>`).join('')}</ul>`;
 h+=`<div class="act"><button class="btn ghost" onclick="mkFollow('${o.id}')">Prepara un seguiment</button></div><div class="small mut" style="margin-top:6px">El seguiment no s'envia: crea una proposta a Aprovacions.</div>`;

 if(!C.aps.some(a=>a.id===newId)){C.aps.unshift({id:newId,type:'Seguiment',order:id,title:'Seguiment de la '+id+' ('+s.n+')',brief:'Proposta creada des del detall de la comanda.',why:'Preparada manualment des de la comanda. Sense confirmació actualitzada, el pla queda en risc.',draft:{to:s.c+' <comercial@proveidor-demo.example>',subj:'Estat de la comanda '+id,body:'Bon dia '+s.c.split(' ')[0]+',\n\nEns podeu confirmar l’estat de la comanda '+id+' i la data d’entrega actualitzada?\n\nGràcies,\n'+C.contact+'\n'+C.name+' (demo)'}})}

vProd=function(){if(!selectedOf)selectedOf=C.of.find(f=>f.risk)?.id||C.of[0].id;const f=C.of.find(x=>x.id===selectedOf);$('#view').innerHTML=`<div class="heading"><div class="eyebrow">FABRICACIÓ / DISPONIBILITAT DE MATERIAL</div><h1>Producció i compres</h1><div class="sub">Ordres de fabricació, materials pendents i decisions compartides.</div></div><div class="card tw"><table class="production-table"><thead><tr><th>Ordre / màquina</th><th>Inici previst</th><th>Lliurament</th><th>Material rebut</th><th>Estat</th></tr></thead><tbody>${C.of.map(o=>`<tr class="row ${o.id===selectedOf?'active-row':''}" onclick="selectedOf='${o.id}';vProd()"><td><b>${o.id}</b><div class="mut small">${esc(o.machine)}</div></td><td>${esc(o.start)}</td><td>${esc(o.due)}</td><td>${o.lines.filter(l=>l.st==='Rebut').length} / ${o.lines.length} necessitats</td><td><span class="tag ${o.risk?'t-red':'t-grn'}">${o.risk?'Material pendent':'En termini'}</span></td></tr>`).join('')}</tbody></table></div><div class="material-detail card"><div class="headrow"><div><div class="eyebrow">MATERIALS DE ${f.id}</div><h2>${esc(f.machine)}</h2></div><span class="small mut">${esc(f.sector)}</span></div>${f.lines.map(l=>`<div class="material-row"><span class="tag ${l.st==='Rebut'?'t-grn':l.st==='Risc'?'t-red':'t-amb'}">${esc(l.st)}</span><div><b>${esc(l.need)}</b><div class="mut">${esc(l.info)}</div></div></div>`).join('')}${f.ap?`<div class="act"><button class="btn" onclick="openAp('${f.ap}')">${D[f.ap]?'Veure la decisió':'Revisar opcions amb compres'}</button></div>`:''}<p class="small mut">No es replanifica cap ordre ni s'actualitza l'ERP. Els canvis es revisen i s'aproven manualment.</p></div>`};
const oldOrders=vOrders;vOrders=function(){oldOrders();$('#view .sub').textContent='Comandes, dates confirmades i recepcions parcials.'};
const oldOB=vOrdersBody;vOrdersBody=function(){oldOB();document.querySelectorAll('#chips .chip').forEach((b,i)=>b.classList.toggle('on',['all','late','part','noc'][i]===state.chip))};
const oldReset=resetAll;resetAll=function(){for(const a of C.aps)localStorage.removeItem(LS+'-draft-'+a.id);localStorage.removeItem(LS+'-custom');C.aps=C.aps.filter(a=>!a.id.startsWith('ap-x-'));queueMode='pending';selectedAp=null;oldReset()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDr()});

const prevMes=vMes;vMes=function(){prevMes();if(state.tab==='real')$('#mb').insertAdjacentHTML('beforeend',`<p class="small mut" style="margin-top:18px">Referències de producte: <a href="https://www.cybrosys.com/odoo/odoo-books/v19/purchase/orders-menu/" target="_blank" rel="noopener">Odoo Purchase</a> · <a href="https://support.sourceday.com/hc/en-us/articles/5031289206292-Managing-POs-from-the-dashboard-accept-update-respond" target="_blank" rel="noopener">SourceDay PO Collaboration</a>. Estructura de llistes, detall i revisió de canvis; implementació pròpia, sense afiliació.</p>`)};

rejectAsk=function(id){const p=activeReview();if(p.querySelector('#rejbox'))return;p.insertAdjacentHTML('beforeend',`<div id="rejbox" style="margin-top:16px"><h3>Motiu del rebuig</h3><input id="rejnote" aria-label="Motiu del rebuig" style="width:100%" placeholder="Opcional"><div class="act"><button class="btn" onclick="decideAp('${id}','rebutjada')">Confirma el rebuig</button></div></div>`);p.querySelector('#rejbox').scrollIntoView({behavior:'smooth'})};

const _pv=new URLSearchParams(location.search);
if(_pv.get('v'))state.route=_pv.get('v');
if(_pv.get('t'))state.tab=_pv.get('t');
render();
if(_pv.get('ap'))openAp(_pv.get('ap'));
if(_pv.get('o'))openOrder(_pv.get('o'));
</script></body></html>
